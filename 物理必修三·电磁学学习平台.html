<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理必修三 · 电磁学学习平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563EB'/%3E%3Cstop offset='1' stop-color='%230891B2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='26' cy='26' r='9' fill='%23fff'/%3E%3Ccircle cx='38' cy='38' r='9' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M26 17v-6M17 26h-6M26 35v6M35 26h6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F6FC; --bg2:#EAF0FB; --ink:#17233D; --muted:#5B6B84; --line:#E2E9F5;
  --card:#FFFFFF; --shadow:0 8px 28px rgba(23,42,80,.08);
  --c9:#2563EB; --c10:#7C3AED; --c11:#EA580C; --c12:#059669; --c13:#0891B2;
  --ok:#16A34A; --warn:#D97706; --bad:#DC2626;
  --r:14px; --r-s:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px;-webkit-font-smoothing:antialiased}
::selection{background:#BFD3FE}
:focus-visible{outline:2px solid var(--c9);outline-offset:2px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img,canvas,svg{max-width:100%}
.mono{font-variant-numeric:tabular-nums}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16.5px;letter-spacing:.2px;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:11.5px;display:block;line-height:1.2}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.nav a{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:#3D4C66;white-space:nowrap;transition:.18s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a.on{background:var(--ink);color:#fff}
.nav .n-badge{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--c9);color:#fff;margin-left:4px;vertical-align:2px}

/* ===== 视图容器 ===== */
.view{display:none}
.view.on{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

/* ===== 首页 ===== */
.hero{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#0F1E4D 0%,#1E3A8A 42%,#0E7490 100%);color:#fff;min-height:430px;display:flex;align-items:center;padding:38px 44px;box-shadow:0 20px 50px rgba(15,30,77,.35)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero-in{position:relative;z-index:2;max-width:640px}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:999px;font-size:12.5px;letter-spacing:.6px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,4.4vw,46px);font-weight:900;line-height:1.22;letter-spacing:.5px}
.hero h1 .grad{background:linear-gradient(90deg,#7DD3FC,#C4B5FD,#6EE7B7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{margin-top:14px;font-size:15px;color:rgba(255,255,255,.82);max-width:560px}
.hero-cta{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.18s}
.btn svg{width:16px;height:16px}
.btn-primary{background:#fff;color:#0F1E4D}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,255,255,.25)}
.btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-solid{background:var(--c9);color:#fff}
.btn-solid:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-soft{background:var(--bg2);color:var(--ink)}
.btn-soft:hover{background:#DCE7F8}
.hero-stats{position:absolute;right:40px;bottom:34px;z-index:2;display:flex;gap:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:16px 24px;border-radius:16px;backdrop-filter:blur(6px)}
.hero-stats .n{font-size:24px;font-weight:900;line-height:1.1}
.hero-stats .l{font-size:11.5px;color:rgba(255,255,255,.75)}

.section-title{display:flex;align-items:center;gap:12px;margin:42px 0 18px}
.section-title .bar{width:5px;height:26px;border-radius:3px;background:var(--c9)}
.section-title h2{font-size:22px;font-weight:800;letter-spacing:.3px}
.section-title .more{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}

/* 章节卡片 */
.ch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ch-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.ch-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.ch-card .ch-num{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.75}
.ch-card h3{font-size:15.5px;font-weight:800;margin:6px 0 4px;line-height:1.35}
.ch-card .secs{font-size:12px;color:var(--muted);line-height:1.6}
.ch-card .ch-ico{position:absolute;right:-14px;bottom:-14px;width:86px;height:86px;opacity:.12}
.ch-card .go{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;color:#fff}
.ch-card:hover .go{opacity:1}
.ch-card .go svg{width:14px;height:14px}
@media(max-width:1080px){.ch-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.ch-grid{grid-template-columns:1fr 1fr}}

/* 模块入口卡 */
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:16px;transition:.2s;cursor:pointer}
.mod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mod-ico{width:52px;height:52px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.mod-ico svg{width:26px;height:26px}
.mod-card h4{font-size:16px;font-weight:800;margin-bottom:4px}
.mod-card p{font-size:12.8px;color:var(--muted);line-height:1.6}
@media(max-width:900px){.mod-grid{grid-template-columns:1fr}}

/* 知识图谱 */
.graph-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.graph-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.graph-toolbar .t-tip{font-size:12.5px;color:var(--muted)}
.g-switch{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.g-switch button{border:none;background:transparent;padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.g-switch button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(23,42,80,.12)}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.g-legend .lg{display:inline-flex;align-items:center;gap:6px}
.g-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.graph-box{position:relative;width:100%;height:600px;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(circle at 20% 30%,#EAF1FD 0,transparent 45%),
  radial-gradient(circle at 80% 70%,#EDE7FB 0,transparent 45%),
  radial-gradient(circle at 65% 20%,#E7F7F1 0,transparent 40%),
  #FBFCFE;
  overflow:hidden}
.graph-box svg{width:100%;height:100%;display:block}
.graph-box .g-hint{position:absolute;right:14px;top:10px;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none}
.g-node{cursor:pointer}
.g-node .chip{fill:#fff;stroke:#D7E2F5;stroke-width:1.2}
.g-node text{font-family:inherit;font-weight:600;pointer-events:none}
.g-node.root .chip{fill:url(#ggrad);stroke:none}
.g-node:hover .chip{stroke-width:2.4;filter:drop-shadow(0 4px 10px rgba(23,42,80,.22))}
.g-edge{fill:none;stroke:#C3CFE3;stroke-width:1.4}
.g-edge.prereq{stroke:#94A3B8;stroke-width:1.4;stroke-dasharray:5 4}
.g-edge.prereq:hover{stroke:var(--warn)}
.edge-label{font-size:10px;fill:#7C8AA0}
.g-node .nname{font-size:12.5px;fill:var(--ink);text-anchor:middle}
.g-node .nsub{font-size:9.5px;fill:#8A97AD;text-anchor:middle}
.g-node.concept .chip{fill:#F5F7FB;stroke:#C9D6EC}
.g-node.concept .nname{font-size:11px}
.g-path{position:absolute;left:16px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:60%;box-shadow:0 4px 14px rgba(23,42,80,.08)}
.g-path b{color:var(--ink)}

/* ===== 章节学习页 ===== */
.learn-head{border-radius:18px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px}
.learn-head .crumb{font-size:12.5px;opacity:.85;margin-bottom:6px}
.learn-head h2{font-size:26px;font-weight:900;letter-spacing:.5px}
.learn-head .tagline{font-size:13.5px;opacity:.9;margin-top:4px}
.learn-head .ln{position:absolute;right:26px;top:20px;font-size:60px;font-weight:900;opacity:.16;line-height:1}
.learn-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:960px){.learn-grid{grid-template-columns:1fr}}
.learn-main{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px}
.learn-side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.goal-card h4{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--c9)}
.goal-card ol{margin-left:18px;font-size:13.2px;color:#3A4A66;line-height:1.9}
.side-nav{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.side-nav h4{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--muted)}
.side-nav a{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:8px;color:#3D4C66;font-weight:500}
.side-nav a:hover{background:var(--bg2)}
.side-nav a.on{background:var(--bg2);color:var(--c9);font-weight:700}
.side-nav a .dot{width:7px;height:7px;border-radius:50%;flex:none}

.mod-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin:26px 0 12px;padding-top:6px;letter-spacing:.3px}
.mod-title:first-child{margin-top:0}
.mod-title .idx{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.learn-main p{margin:8px 0;font-size:14.5px;color:#26344E}
.learn-main p.li{padding-left:18px;position:relative;margin:5px 0}
.learn-main p.li::before{content:"";position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:2px;background:var(--c9)}
.formula{background:linear-gradient(90deg,#F2F6FE,#F8F5FE);border:1px solid #DCE7FA;border-radius:12px;padding:14px 18px;margin:12px 0;font-family:'Noto Serif SC','Times New Roman',serif;font-size:16.5px;text-align:center;color:#14264D;letter-spacing:.5px;overflow-x:auto}
.formula .tag{display:block;font-size:11px;color:#8A97AD;font-family:'Noto Sans SC',sans-serif;margin-bottom:4px;letter-spacing:.5px}
.note{background:#FFFBEB;border:1px solid #FDE9C4;border-left:4px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:13.5px;color:#7A5200}
.note b{color:#92400E}
.klist{margin:6px 0}
i.m{font-style:normal;font-family:'Noto Serif SC','Times New Roman',serif;background:#EFF4FE;border:1px solid #D8E4FA;border-radius:5px;padding:0 6px;font-size:.95em;color:#1D3A6E}
.ex-title{background:var(--c9);color:#fff;display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:9px 9px 0 0;font-size:13.5px;font-weight:700;margin-top:18px}
.ex-solve{background:#F0F6FF;border:1px solid #D6E6FF;border-radius:0 10px 10px 10px;padding:14px 18px;margin-bottom:6px;font-size:13.8px;color:#1D3A6E}
.ex-solve .step{color:var(--c9);font-weight:700}
.demo-embed{background:#0E1728;border-radius:14px;margin:14px 0;overflow:hidden;border:1px solid #1E2B45}
.demo-embed .demo-head{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#DCE6F7;font-size:13.5px;font-weight:700;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.demo-embed .demo-head svg{width:18px;height:18px;color:#7DD3FC}
.demo-embed canvas{display:block;width:100%;height:auto;background:#0E1728}
.demo-ctrl{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px;background:#111D33;align-items:center}
.demo-ctrl label{display:flex;align-items:center;gap:7px;font-size:12.3px;color:#B9C7E0}
.demo-ctrl input[type=range]{width:130px;accent-color:#7DD3FC}
.demo-ctrl .val{min-width:52px;text-align:right;color:#7DD3FC;font-weight:700;font-variant-numeric:tabular-nums}
.demo-ctrl select{background:#1B2A48;color:#DCE6F7;border:1px solid #33466E;border-radius:8px;padding:4px 10px;font-size:12.5px}
.demo-ctrl .btn-mini{border:1px solid #33466E;background:#1B2A48;color:#DCE6F7;border-radius:8px;padding:4px 14px;font-size:12.5px;font-weight:600}
.demo-ctrl .btn-mini:hover{background:#24365C}
.demo-ctrl .btn-mini.act{background:#0EA5E9;border-color:#0EA5E9;color:#fff}
.demo-stat{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;background:#0B1424;font-size:12.3px;color:#93A7C8;border-top:1px solid rgba(255,255,255,.06)}
.demo-stat b{color:#7DD3FC;font-weight:700}

/* ===== 动画实验室 ===== */
.sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1100px){.sim-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.sim-grid{grid-template-columns:1fr}}
.sim-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;cursor:pointer}
.sim-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sim-card .sim-thumb{height:150px;background:#0E1728;position:relative}
.sim-card .sim-thumb canvas{width:100%;height:100%;opacity:.85}
.sim-card .sim-body{padding:14px 16px}
.sim-card .sim-tag{font-size:10.5px;font-weight:700;letter-spacing:.8px;color:#fff;padding:2px 9px;border-radius:99px}
.sim-card h4{font-size:14.5px;font-weight:800;margin:8px 0 4px}
.sim-card p{font-size:12.3px;color:var(--muted);line-height:1.55}
.sim-detail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.sim-detail h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sim-detail .sim-desc{font-size:13px;color:var(--muted);margin-bottom:14px}

/* ===== 题库 ===== */
.quiz-toolbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.quiz-toolbar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.quiz-toolbar .lbl{font-size:13px;font-weight:700;color:var(--muted);width:52px}
.q-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:#3D4C66;transition:.15s;cursor:pointer}
.q-chip:hover{border-color:var(--c9);color:var(--c9)}
.q-chip.on{color:#fff}
.q-chip.on.ch9{background:var(--c9);border-color:var(--c9)}
.q-chip.on.ch10{background:var(--c10);border-color:var(--c10)}
.q-chip.on.ch11{background:var(--c11);border-color:var(--c11)}
.q-chip.on.ch12{background:var(--c12);border-color:var(--c12)}
.q-chip.on.ch13{background:var(--c13);border-color:var(--c13)}
.q-count{font-size:13px;color:var(--muted);margin-left:auto}
.q-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;transition:.15s}
.q-item:hover{border-color:#B9CCE8}
.q-item .q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px}
.q-tag{padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;letter-spacing:.4px}
.q-type{color:var(--muted);font-weight:500}
.q-qnum{color:#94A3B8;font-weight:600}
.q-item .q-stem{font-size:14.5px;color:#1F2D47;margin:6px 0 4px;line-height:1.85}
.q-opts{margin:6px 0 2px 4px;font-size:13.8px;color:#33425E}
.q-opts div{padding:2px 0}
.q-item .q-note{font-size:12px;color:#8A97AD;margin-top:4px}
.q-ans-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1px solid var(--line);background:var(--bg);color:#3D4C66;padding:5px 14px;border-radius:99px;font-size:12.5px;font-weight:600}
.q-ans-btn:hover{border-color:var(--c9);color:var(--c9)}
.q-ans{display:none;margin-top:10px;background:#F4F8FE;border:1px solid #D6E6FF;border-radius:10px;padding:12px 16px;font-size:13.5px}
.q-ans.show{display:block}
.q-ans .ans-lbl{color:var(--c9);font-weight:800;margin-right:6px}
.q-empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.q-shuffle{display:inline-flex;align-items:center;gap:6px}

/* ===== 学生学情 ===== */
.stu-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.stu-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.panel h3 svg{width:19px;height:19px;color:var(--c9)}
.drop-zone{border:2px dashed #C3D3EC;border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.18s;background:#FAFCFF}
.drop-zone:hover,.drop-zone.drag{border-color:var(--c9);background:#EFF5FF;color:var(--c9)}
.drop-zone svg{width:30px;height:30px;margin-bottom:8px;color:#9DB4DD}
.tpl{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:12.3px;color:var(--muted);margin-top:12px;line-height:1.9;overflow-x:auto}
.tpl code{background:#E3EAF7;padding:1px 6px;border-radius:5px;font-size:11.5px}
.stu-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
table.tbl{width:100%;border-collapse:collapse;font-size:13.2px;margin-top:6px}
table.tbl th{text-align:left;padding:8px 10px;background:var(--bg2);color:#33425E;font-weight:700;font-size:12.3px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid #EDF1F9;vertical-align:middle}

  blocks:[

    '- 高压设备中的导体表面尽量光滑，减少尖端放电造成的电能损失（夜间高压线周围的"电晕"就是微弱放电）',
    '## 静电屏蔽',
    '处于静电平衡状态的空腔导体，内表面没有电荷，导体壳内空腔里的电场强度处处为 0。无论导体外部电场如何，导体内部都不会有电场——金属壳的这种作用叫**静电屏蔽**。',

's10-1':{

  goals:['理解静电力做功与路径无关的特点','理解电势能的概念及其变化与静电力做功的关系','掌握电势的定义 φ=Ep/q','知道沿电场线方向电势逐渐降低'],
  blocks:[
    '## 问题引入',
    '一个正电荷在电场中只受静电力作用，由 A 点运动到 B 点时静电力做了正功，动能增加。从能量转化的角度，有另外一种形式的能量减少了——这是一种什么形式的能量？',
    '## 静电力做功的特点',

    '## 电势能',
    '电荷在电场中也具有势能，叫**电势能**，用 Ep 表示。静电力做的功等于电势能的减少量：',
    '$$ WAB = EpA − EpB',
    '- 静电力做正功 → 电势能减少',
    '- 静电力做负功 → 电势能增加',
    '只有先把电场中某点的电势能规定为 0，才能确定其他点的电势能。通常规定电荷在离场源电荷**无限远处**的电势能为 0，或把电荷在大地表面的电势能为 0。',
    '> 电势能是相互作用的电荷（或电荷及对它作用的电场）所共有的，说"某个电荷的电势能"只是简略说法。',
    '## 电势',
    '电荷在电场中某一点的电势能与它的电荷量之比，叫作电场在这一点的**电势**。',
    '$$ 电势：φ = Ep / q',
    '- 单位：伏特（V），1 V = 1 J/C',
    '- 电势是标量，只有大小没有方向，可正可负',
    '- 电势由电场中该点的性质决定，与试探电荷无关',
    '- 沿电场线方向电势逐渐降低',
    '- 确定某点电势前必须先规定零电势点（理论上取无限远，实际上常取大地）',
    '## 典型例题',
    '例 电荷量 q₁=4×10⁻⁹ C 的试探电荷放在电场中的 A 点，具有 6×10⁻⁸ J 的电势能。A 点的电势是多少？若把 q₂=-2×10⁻¹⁰ C 的试探电荷放在 A 点，q₂ 所具有的电势能是多少？',
    '答 φA = EpA/q₁ = 6×10⁻⁸ / 4×10⁻⁹ = 15 V',
    '答 Ep₂ = q₂·φA = -2×10⁻¹⁰ × 15 = -3×10⁻⁹ J（负电荷在正电势点的电势能为负值）',
    '## 动画演示',
    '!demo:demo-ep',
    '## 本节小结',
    '- 静电力做功与路径无关，W = qEd',
    '- 电势能：WAB = EpA − EpB，静电力做正功电势能减少',
    '- 电势：φ = Ep/q，标量，沿电场线方向降低',

  ]
},
's10-2':{

  blocks:[

    '- 相邻等势面间电势差相等时，等势面越密的地方电场强度越大',

  blocks:[

    '## 电势差与电场强度的关系',
    '以匀强电场为例：电荷 q 从 A 点移动到 B 点，静电力做功 W = qUAB，同时 W = Fd = qEd，比较可得：',

    '$$ 单位关系：1 V/m = 1 N/C',
    '## 重要推论与应用',
    '- 两相邻等势线之间的电势差 U 相同时，E 越大的地方，等势线间距 d 越小——这就是电场线密处等势线也密的原因',
    '- 带电粒子仅在静电力作用下被电场加速：qU = ½mv²，只要加速电压 U 一定，粒子加速后获得的动能就是一定的（与距离无关）',
    '## 典型例题',
    '例 真空中平行金属板 M、N 距离 0.04 m，带电粒子（m=2×10⁻¹⁵ kg，q=8×10⁻¹⁵ C）位于 M 板旁，两板加 200 V 电压。（1）求粒子所受静电力；（2）求粒子从静止开始到达 N 板时的速度。',
    '答 （1）E = U/d = 200/0.04 = 5000 V/m；F = Eq = 5000×8×10⁻¹⁵ = 4×10⁻¹¹ N',
    '答 （2）由 qU = ½mv²：v = √(2qU/m) = √(2×8×10⁻¹⁵×200/2×10⁻¹⁵) = 40 m/s',

    '- E = U/d：场强数值上等于沿电场方向单位距离降低的电势',
    '- 1 V/m = 1 N/C；qU = ½mv² 是分析带电粒子加速的利器',

},
's10-4':{
  ch:'ch10', title:'电容器的电容', slug:'10.4',
  goals:['了解电容器的构造与充放电过程','掌握电容的定义 C=Q/U 及其单位','掌握平行板电容器电容的决定因素','了解常用电容器与额定电压、击穿电压'],
  blocks:[
    '## 问题引入',
    '水可以用容器储存起来，电荷也可以用一个"容器"储存起来——电容器。它内部的构造是怎样的？它是怎样"装进"和"倒出"电荷的呢？',
    '## 电容器',
    '在两个相距很近的平行金属板中间夹上一层绝缘物质（电介质），就组成最简单的**平行板电容器**。实际上，任何两个彼此绝缘又相距很近的导体都可以看成一个电容器。',
    '**充电**：把电容器两极板分别接电源正、负极，两极板带上等量异种电荷，两极板间有电势差。即使断开电源，电荷由于相互吸引仍被保存在电容器中。',
    '**放电**：用导线把两极板接通，正负电荷中和，两极板的电荷量、电势差以及放电电流都逐渐减小到 0。',
    '## 电容',
    '精确实验表明：一个电容器所带的电荷量 Q 与两极板之间的电势差 U 之比是不变的。',
    '$$ 电容：C = Q / U',
    '- 电容在数值上等于使两极板间电势差为 1 V 时电容器需要带的电荷量',
    '- 电容表征电容器储存电荷的本领，与 Q、U 无关',
    '- 单位：法拉（F）；1 μF = 10⁻⁶ F；1 pF = 10⁻¹² F',
    '## 平行板电容器的电容',
    '平行板电容器的电容由正对面积 S、板间距离 d 与电介质决定：',
    '$$ C = εr·S / (4πkd)',
    '- 正对面积 S 增大 → 电容增大',
    '- 两极板间距离 d 增大 → 电容减小',
    '- 插入电介质 → 电容变为真空时的 εr 倍（εr 为相对介电常数）',
    '> 电容器外壳上标的是工作电压（额定电压），比击穿电压低。加在两极板上的电压不能超过击穿电压，否则电介质被击穿、电容器损坏。',
    '## 常用电容器',
    '- 固定电容器：聚苯乙烯电容器、电解电容器（氧化膜很薄，电容较大）',
    '- 可变电容器：转动动片改变正对面积，电容随之改变',
    '- 超级电容器：充电时间短、储存电能多、放电功率大、寿命长',
    '## 动画演示',
    '!demo:demo-capacitor',
    '## 本节小结',
    '- 电容器：储存电荷的元件；充电、放电过程能量转化',
    '- 电容：C = Q/U，单位法拉 F',
    '- 平行板电容器：C = εrS/(4πkd)，S 大 C 大、d 大 C 小、插介质 C 大',
    '!quiz:ch10'
  ]
},

  goals:['掌握带电粒子在电场中加速的分析方法','掌握带电粒子在电场中偏转的类平抛分析方法','了解示波管的原理'],
  blocks:[
    '## 问题引入',
    '医用电子直线加速器中，电子是受到什么力的作用而加速的？现代科学实验和技术设备中，常常利用电场来改变或控制带电粒子的运动。',

's11-1':{
  ch:'ch11', title:'电源和电流', slug:'11.1',
  goals:['理解电源在电路中维持持续电流的作用','理解恒定电流的概念，掌握电流的定义式','掌握电流的微观表达式 I=neSv'],
  blocks:[
    '## 问题引入',
    '电闪雷鸣时，强大的电流只能存在于一瞬间，而手电筒中的小灯泡却能持续发光，这是为什么？',
    '## 电源',
    '两个分别带正、负电荷的导体用导线相连，自由电子在静电力作用下定向移动，A、B 之间电势差很快消失，电流只是瞬时的。',
    '如果在 A、B 之间连接一个装置 P，它能不断地把电子从 A 搬运到 B，使 A、B 始终带一定数量的正、负电荷，A、B 之间始终存在电势差，导线中就会存在持续电流。能搬运电荷的装置就是**电源**，A、B 是电源的两个电极。',
    '> 电源的作用：把电子从正极搬运到负极（相当于把正电荷从负极搬运到正极），维持两极间的电势差。',

's12-1':{
  ch:'ch12', title:'电路中的能量转化', slug:'12.1',
  goals:['掌握电功与电功率的计算','掌握焦耳定律及其应用','会分析含电动机等非纯电阻电路的能量转化'],
  blocks:[
    '## 问题引入',
    '电灯、电视、电热水壶、电动汽车……你知道这些用电器中的能量是怎样转化的吗？电能转化为其他形式的能，是通过电流做功来实现的。',
    '## 电功和电功率',
    '电流做功的实质是导体中的恒定电场对自由电荷的静电力做功。电荷经过一段电路用时 t，通过截面的电荷量 q = It，静电力做的功为：',
    '$$ 电功：W = UIt',
    '$$ 电功率：P = W / t = UI',
    '- 电功单位：焦耳（J）；电功率单位：瓦特（W）',
    '- 1 度电 = 1 kW·h = 3.6×10⁶ J',
    '## 焦耳定律',
    '电流通过导体产生的热量跟电流的二次方成正比，跟导体的电阻及通电时间成正比：',
    '$$ 焦耳定律：Q = I²Rt',
    '纯电阻电路（如电热器）：电能全部转化为内能，W = Q，此时 P = UI = I²R = U²/R',
    '$$ 发热功率：P热 = I²R',
    '## 电路中的能量转化：电动机',
    '电动机从电源获得能量，一部分转化为机械能，还有一部分（线圈电阻）转化为内能。',
    '$$ P电 = P机 + P热，其中 P电 = UI，P热 = I²R',
    '> 注意：电动机是非纯电阻电路，U ≠ IR，不能直接使用 U²/R 计算电功率。',
    '## 典型例题',
    '例 一台电动机，线圈电阻 0.4 Ω，两端电压 220 V，通过电流 5 A。求发热功率与对外做功的功率。',
    '答 P热 = I²R = 5²×0.4 = 10 W；P电 = UI = 220×5 = 1100 W',
    '答 P机 = P电 − P热 = 1100 − 10 = 1090 W',
    '## 动画演示',
    '!demo:demo-joule',
    '## 本节小结',
    '- 电功：W = UIt；电功率：P = UI',
    '- 焦耳定律：Q = I²Rt，纯电阻电路 W = Q',
    '- 电动机：P电 = P机 + P热，非纯电阻电路 U ≠ IR',
    '!quiz:ch12'
  ]
},
's12-2':{
  ch:'ch12', title:'闭合电路的欧姆定律', slug:'12.2',
  goals:['理解电动势的物理意义','掌握闭合电路欧姆定律 I=E/(R+r)','掌握路端电压与负载的关系 U=E−Ir'],
  blocks:[
    '## 问题引入',
    '多个并联的小灯泡的亮度明显比单独一个小灯泡暗。如何解释这一现象？',

    '电源内部存在由正极指向负极的电场，静电力阻碍正电荷向正极移动。要使正电荷向正极移动，必须有与静电力方向相反的力——**非静电力**。',
    '电源是通过非静电力做功把其他形式的能转化为电势能的装置。非静电力所做的功与所移动的电荷量之比叫**电动势**：',
    '$$ 电动势：E = W / q',
    '- 单位：伏特（V）',
    '- 电动势在数值上等于非静电力把 1 C 的正电荷在电源内从负极移送到正极所做的功',
    '- 电动势由电源中非静电力的特性决定，跟外电路无关',
    '## 闭合电路欧姆定律',
    '用电器和导线组成外电路，电源内部是内电路（有内阻 r）。由能量守恒：非静电力做的功 = 内、外电路转化的内能之和。',

    '$$ 闭合电路欧姆定律：I = E / (R + r)',
    '也可以写成：E = U外 + U内（电源电动势等于内、外电路电势降落之和）。',
    '## 路端电压与负载的关系',
    '$$ 路端电压：U = E − Ir',

    '- **断路**：I = 0，U = E（常用此方法测电源电动势）',
    '- **短路**：R = 0，I = E/r，电流很大，会烧坏电源甚至引起火灾——绝对不允许将电源两端用导线直接连接',
    '## U-I 图像',
    '由 U = −rI + E，U-I 图像是一条直线：纵截距 = 电动势 E，斜率绝对值 = 内阻 r。',
    '> 欧姆表原理（拓展）：表内电源与表头串联，被测电阻与电流一一对应，但刻度不均匀。',

    '!demo:demo-ohm',

    '- 闭合电路欧姆定律：I = E/(R+r)，E = U外 + U内',
    '- 路端电压：U = E − Ir；断路 U = E，短路 I = E/r（危险）',
    '- U-I 图像：截距 = E，斜率绝对值 = r',
    '!quiz:ch12'
  ]
},
's12-3':{
  ch:'ch12', title:'实验：电池电动势和内阻的测量', slug:'12.3',
  goals:['掌握用电压表、电流表测电动势和内阻的方法','会用 U-I 图像处理数据求出 E 和 r','了解用电流表（或电压表）配合电阻箱的测量方案'],
  blocks:[
    '## 实验思路',
    '根据闭合电路欧姆定律：',
    '$$ E = U + Ir',
    '如果能测出 U、I 的两组数据，就可以列出两个关于 E、r 的方程解出结果。用电压表、电流表加上滑动变阻器 R，即可测定电源的电动势 E 和内阻 r。',
    '## 物理量的测量',
    '只测两组数据误差较大，应使用滑动变阻器改变外电路的电阻，进行**多次测量**。',
    '## 数据分析：U-I 图像法',
    '把 E = U + Ir 改写成 U = −Ir + E，以 U 为纵坐标、I 为横坐标描点画直线：',
    '- 直线与 U 轴交点的值 = 断路时的路端电压 = 电动势 E',

{id:'q901', ch:'ch9', sec:'s9-1', type:'概念', stem:'用梳子梳过干燥的头发后，梳子能吸引纸屑。请用原子结构的知识解释这个现象。', ans:'梳子与头发摩擦时发生电荷转移：头发束缚电子能力较弱，电子转移到梳子上，梳子带负电；带电体吸引轻小物体（静电感应使纸屑靠近端带异种电荷），所以梳子能吸引纸屑。', ana:'摩擦起电的本质是电子转移，得电子带负电；带电体吸引轻小物体是静电感应与库仑引力共同作用的结果。'},
{id:'q902', ch:'ch9', sec:'s9-1', type:'计算', stem:'在图 9.1-3 的静电感应实验中，导体分开后 A 带 -1.0×10⁻⁸ C 的电荷。是电子由 A 转移到 B 还是由 B 转移到 A？A、B 各得到或失去多少电子？', ans:'电子由 B 转移到 A。n = |Q|/e = 1.0×10⁻⁸ / 1.6×10⁻¹⁹ = 6.25×10¹⁰ 个。A 得到 6.25×10¹⁰ 个电子，B 失去 6.25×10¹⁰ 个电子。', ana:'靠近正电荷 C 的 A 端感应出负电，说明 A 端获得电子；电子数与电荷量、元电荷的关系 n=Q/e。'},
{id:'q903', ch:'ch9', sec:'s9-2', type:'计算', stem:'A、B 两个相同的金属小球分别带有等量异种电荷 ±Q，相距 r 时静电力为 F。用不带电的小球 C 先后与 A、B 接触，再将 A、B 间距离增大为原来的 2 倍，求此时 A、B 间的静电力。', ans:'接触后：A 带 Q/2，B 带 -Q/4（C 先带 +Q/2 与 B 的 -Q 中和后平分得 -Q/4）。F′ = k(Q/2)(Q/4)/(2r)² = kQ²/(32r²) = F/32。', ana:'C 与 A 接触：A、C 各带 Q/2；C 再与 B 接触：(Q/2−Q)/2 = −Q/4；距离增大 2 倍使力减小到 1/4。'},
{id:'q904', ch:'ch9', sec:'s9-2', type:'计算', stem:'两个质量均为 0.6 g 的带电小球用 13 cm 长的绝缘细线悬挂于同一点，平衡时两球相距 10 cm。求每个小球所带电荷量（g 取 10 m/s²）。', ans:'几何关系：h=√(13²−5²)=12 cm，tanθ=5/12。F=mg·tanθ=0.6×10⁻³×10×(5/12)=2.5×10⁻³ N。由 F=kq²/r²：q=√(Fr²/k)=√(2.5×10⁻³×0.1²/9×10⁹)≈5.3×10⁻⁸ C。', ana:'平衡条件：三力平衡（重力、拉力、静电力），用悬挂几何求出 tanθ；电荷量 q=√(Fr²/k)。'},
{id:'q905', ch:'ch9', sec:'s9-3', type:'计算', stem:'质量为 1.0×10⁻³ kg、电荷量 2.0×10⁻⁸ C 的带电小球用绝缘细线悬挂在水平向右的匀强电场中，静止时细线与竖直方向成 30° 角。求电场强度 E。', ans:'三力平衡：qE = mg·tan30°。E = mg·tan30°/q = 1.0×10⁻³×10×(1/√3)/(2.0×10⁻⁸) ≈ 2.9×10⁵ N/C。', ana:'电场力水平方向与重力、拉力平衡；tanθ=qE/mg。'},
{id:'q906', ch:'ch9', sec:'s9-3', type:'概念', stem:'电场中某点放入电荷量 q 的试探电荷，测得电场力为 F。若把试探电荷取走，该点的电场强度 E 变为多少？', ans:'仍为 E = F/q 所对应的值，与试探电荷是否存在无关。电场强度由电场本身（场源电荷）决定。', ana:'比值定义法：E 是电场本身的性质，与试探电荷的有无、大小、正负无关。'},
{id:'q907', ch:'ch9', sec:'s9-3', type:'选择', stem:'关于电场线，下列说法正确的是（　）A. 电场线是电荷运动的轨迹　B. 电场线从负电荷出发到正电荷终止　C. 电场线越密的地方电场强度越大　D. 电场线可以相交', opts:['A','B','C','D'], ans:'C', ana:'电场线是假想的曲线，切线方向表示场强方向、疏密表示强弱；从正电荷或无限远出发，终止于无限远或负电荷；不相交。'},
{id:'q908', ch:'ch9', sec:'s9-4', type:'概念', stem:'处于静电平衡状态的导体，其内部电场强度有什么特点？净电荷分布在哪里？', ans:'内部电场强度处处为 0（外电场与感应电荷的附加电场完全抵消）；净电荷只分布在导体的外表面，且越尖锐的位置电荷密度越大。', ana:'静电平衡条件：导体内部合场强为 0，自由电子不再定向移动。'},
{id:'q909', ch:'ch9', sec:'s9-4', type:'概念', stem:'为什么高压设备中的导体表面要尽量光滑？避雷针为什么能防雷击？', ans:'表面越光滑，越不易发生尖端放电（电晕），减少电能损失。避雷针顶端尖锐，通过尖端放电不断中和雷雨云感应出的电荷，使雷电流沿接地引下线入地，避免被雷电击中。', ana:'尖端电荷密度大、周围电场强、易电离空气形成尖端放电。'},
{id:'q910', ch:'ch9', sec:'s9-4', type:'概念', stem:'通信电缆外面常包一层金属网（屏蔽层），它的作用是什么？', ans:'金属网（外导体）构成静电屏蔽，使内部导体不受外界电场干扰，保证信号传输质量。', ana:'静电屏蔽：金属壳/网内部电场强度处处为 0。'},

{id:'q1001', ch:'ch10', sec:'s10-1', type:'计算', stem:'匀强电场中 E=60 N/C，A、B 沿电场方向相距 5 cm，B、C 相距 12 cm 且 BC 与电场方向成 60°。电荷量 4×10⁻⁸ C 的正电荷从 A 经 B 到 C，求静电力做的功 WAB、WBC 和 WAC。', ans:'WAB = qEd₁ = 4×10⁻⁸×60×0.05 = 1.2×10⁻⁷ J；WBC = qEd₂cos60° = 4×10⁻⁸×60×0.12×0.5 = 1.44×10⁻⁷ J；WAC = WAB+WBC = 2.64×10⁻⁷ J。', ana:'静电力做功与路径无关，只取决于沿电场方向的位移：W=qEd。'},
{id:'q1002', ch:'ch10', sec:'s10-1', type:'计算', stem:'电场中 A 点电势为 15 V，电荷量 4×10⁻⁹ C 的正试探电荷在 A 点具有的电势能为多少？若换成 -2×10⁻¹⁰ C 的电荷，电势能又为多少？', ans:'Ep₁ = q₁φA = 4×10⁻⁹×15 = 6×10⁻⁸ J；Ep₂ = q₂φA = -2×10⁻¹⁰×15 = -3×10⁻⁹ J。', ana:'φ=Ep/q，负电荷在正电势点的电势能为负值。'},
{id:'q1003', ch:'ch10', sec:'s10-2', type:'计算', stem:'电场中 A、B 两点电势差 UAB = 20 V，将电荷量 -2×10⁻⁹ C 的电荷从 A 移到 B，静电力做功多少？电势能如何变化？', ans:'W = qUAB = -2×10⁻⁹×20 = -4×10⁻⁸ J（做负功）。电势能增加 4×10⁻⁸ J。', ana:'WAB=qUAB；静电力做负功，电势能增加。'},
{id:'q1004', ch:'ch10', sec:'s10-2', type:'概念', stem:'质子（电荷量 e）经 2 V 电压加速，获得的动能是多少焦耳？', ans:'W = qU = e×2 = 2 eV = 2×1.6×10⁻¹⁹ = 3.2×10⁻¹⁹ J。', ana:'1 eV 是电荷量为 e 的电荷在 1 V 电势差间移动时静电力所做的功，1 eV = 1.6×10⁻¹⁹ J。'},
{id:'q1005', ch:'ch10', sec:'s10-3', type:'计算', stem:'两块带电平行金属板相距 1.3 cm，两板间电势差为 4×10⁴ V，求两板间的电场强度。', ans:'E = U/d = 4×10⁴ / 0.013 ≈ 3.1×10⁶ V/m。', ana:'匀强电场 E=U/d，注意 d 的单位换算成米。'},
{id:'q1006', ch:'ch10', sec:'s10-3', type:'选择', stem:'关于匀强电场中电势差与电场强度的关系 U=Ed，下列说法正确的是（　）A. 电场中任意两点间电势差都等于 Ed　B. 电势差越大，电场强度一定越大　C. 在匀强电场中两点沿电场方向距离越大，电势差越大　D. 公式 E=U/d 只适用于匀强电场，且 d 是沿电场方向的距离', opts:['A','B','C','D'], ans:'D', ana:'U=Ed 中的 d 必须是沿电场方向的距离；E=U/d 定义的是匀强电场中场强与电势降落的关系。'},
{id:'q1007', ch:'ch10', sec:'s10-4', type:'计算', stem:'某电容器标有"10 μF，25 V"。求额定电压下它储存的电荷量。', ans:'Q = CU = 10×10⁻⁶×25 = 2.5×10⁻⁴ C。', ana:'电容 C=Q/U，注意单位换算 1 μF=10⁻⁶ F。'},
{id:'q1008', ch:'ch10', sec:'s10-4', type:'选择', stem:'平行板电容器充电后与电源断开，仅将两极板间距离增大，则（　）A. 电容增大　B. 电荷量增大　C. 两极板间电压增大　D. 电场强度减小', opts:['A','B','C','D'], ans:'C', ana:'断开电源后 Q 不变；d 增大 → C=εrS/(4πkd) 减小 → U=Q/C 增大；E=U/d 不变（E=4πkQ/εrS）。'},
{id:'q1009', ch:'ch10', sec:'s10-5', type:'计算', stem:'二价氧离子（q=2e）在电压 90 V 的两点间由静止加速，静电力做功多少？', ans:'W = qU = 2×1.6×10⁻¹⁹×90 = 2.88×10⁻¹⁷ J。', ana:'加速问题统一用 W=qU 求解（动能定理），与路径无关。'},
{id:'q1010', ch:'ch10', sec:'s10-5', type:'计算', stem:'电子从静止开始经 5000 V 电压加速，求末速度（mₑ=9.1×10⁻³¹ kg）。', ans:'由 eU = ½mv²：v = √(2eU/m) = √(2×1.6×10⁻¹⁹×5000/9.1×10⁻³¹) ≈ 4.2×10⁷ m/s。', ana:'加速电压决定末动能；速度可达光速的约 14%，高速时需考虑相对论修正。'},
{id:'q1011', ch:'ch10', sec:'s10-5', type:'概念', stem:'带电粒子垂直进入匀强电场会发生什么运动？其轨迹是什么形状？决定偏移量 y 的因素有哪些？', ans:'做类平抛运动（初速度方向匀速、电场方向匀加速），轨迹为抛物线。y = qUl²/(2mdv₀²)：与电压 U、板长 l 的平方成正比，与板距 d、初动能成反比。', ana:'y = ½at²，a=qU/(md)，t=l/v₀。'},

/* ---- 第十一章 ---- */
{id:'q1101', ch:'ch11', sec:'s11-1', type:'计算', stem:'某金属导体通电时电流为 50 μA，求 3.2 s 内通过导体横截面的电荷量及通过的电子数。', ans:'q = It = 50×10⁻⁶×3.2 = 1.6×10⁻⁴ C；n = q/e = 1.6×10⁻⁴/1.6×10⁻¹⁹ = 10¹⁵ 个。', ana:'电流定义式 I=q/t；电子数 n=q/e。'},
{id:'q1102', ch:'ch11', sec:'s11-1', type:'概念', stem:'为什么导线中自由电子定向移动的平均速率很小（约 10⁻⁴ m/s），而开关一闭合整个电路却几乎同时有电流？', ans:'电场以光速在电路中建立，电场驱动**所有**自由电子几乎同时开始定向移动，因此整个电路几乎同时形成电流。', ana:'电流的形成依赖电场的建立而非单个电子的宏观移动速度。'},
{id:'q1103', ch:'ch11', sec:'s11-2', type:'计算', stem:'铜的电阻率 1.7×10⁻⁸ Ω·m。输电线的横截面积为 120 mm²，鸟两爪之间的距离为 4 cm，当输电线中电流为 500 A 时，求鸟两爪之间的电压。', ans:'R = ρl/S = 1.7×10⁻⁸×0.04/(120×10⁻⁶) = 5.7×10⁻⁶ Ω；U = IR = 500×5.7×10⁻⁶ ≈ 2.8×10⁻³ V。', ana:'两爪间导线电阻极小，电压仅毫伏级，鸟不会触电（但严禁接触高压线）。'},
{id:'q1104', ch:'ch11', sec:'s11-2', type:'计算', stem:'一根盐水柱长 30 cm，测得电阻为 R。若将其拉长到 40 cm（体积不变），电阻变为多少？', ans:'体积不变：S′ = S×(30/40) = 0.75S。R′ = ρl′/S′ = ρ×0.4/(0.75S) = (16/9)·ρ×0.3/S = 16R/9。', ana:'电阻定律 R=ρl/S：长度变为 4/3 倍、横截面积变为 3/4 倍，电阻变为 (4/3)÷(3/4)=16/9 倍。'},
{id:'q1105', ch:'ch11', sec:'s11-3', type:'概念', stem:'20 分度的游标卡尺读数规则是什么？其精度是多少？', ans:'读数 = 主尺读数 + 游标尺与主尺对齐的刻度数 × 0.05 mm；精度为 0.05 mm。', ana:'20 分度：游标尺 20 格 = 主尺 19 mm，每格差 0.05 mm。'},
{id:'q1106', ch:'ch11', sec:'s11-3', type:'计算', stem:'螺旋测微器固定刻度读数为 5.5 mm，可动刻度第 24 格与主尺刻度线对齐，估读值为 0.0。求最终读数。', ans:'读数 = 5.5 + 24×0.01 + 0.000 = 5.740 mm。', ana:'螺旋测微器读数 = 固定刻度（含半毫米） + 可动刻度×0.01 mm，需估读到 0.001 mm。'},
{id:'q1107', ch:'ch11', sec:'s11-4', type:'概念', stem:'在图 11.4-7 的分压式电路中，滑动变阻器最大阻值 R₁，定值电阻 R，A、B 间电压为 U。滑动端移动过程中 R 两端电压的变化范围是多少？', ans:'0 ~ U。滑动端位于 A 端时，R 被短路，UR = 0；滑动端位于 B 端时，UR = U。', ana:'分压式接法（电位器）可从 0 开始连续调节电压，这是它相对限流式的重要优点。'},
{id:'q1108', ch:'ch11', sec:'s11-4', type:'计算', stem:'表头内阻 Rg=500 Ω、满偏电流 Ig=1 mA，改装成量程 10 V 和 100 V 的双量程电压表，求分压电阻 R₁、R₂。', ans:'Ug = IgRg = 0.5 V。10 V 挡：R₁ = (10−0.5)/10⁻³ = 9.5 kΩ；100 V 挡：R₂ = (100−10)/10⁻³ = 90 kΩ。', ana:'串联分压：R=(U−Ug)/Ig。'},
{id:'q1109', ch:'ch11', sec:'s11-4', type:'计算', stem:'表头 Rg=30 Ω、Ig=1 mA，改装成量程 0.6 A 的电流表，求分流电阻 R 及改装后电流表的内阻。', ans:'Ug = 1×10⁻³×30 = 0.03 V。R = Ug/(I−Ig) = 0.03/0.599 ≈ 5.0×10⁻² Ω。改装后内阻 RA = Rg·R/(Rg+R) ≈ 5.0×10⁻² Ω。', ana:'并联分流：R=Ug/(I−Ig)；并联后内阻近似等于分流电阻（很小）。'},
{id:'q1110', ch:'ch11', sec:'s11-5', type:'概念', stem:'用多用电表欧姆挡测电阻时，为什么要先"欧姆调零"？换挡后为什么还要重新调零？', ans:'欧姆调零使表笔短接时指针指向电阻"0"刻度，消除电池电动势、内阻变化及接触电阻的影响。换挡后内部电路（倍率）改变，必须重新调零。', ana:'欧姆表内阻与挡位有关；每挡都要在短接表笔时调零。'},
{id:'q1111', ch:'ch11', sec:'s11-5', type:'概念', stem:'用多用电表测电阻时，指针偏转过大或过小应怎么办？测量完毕后选择开关应转到什么位置？', ans:'指针偏转过小（读数过大）应增大倍率，偏转过大（读数过小）应减小倍率，使指针落在刻度盘中间区域。用毕将选择开关旋到 OFF 位置（或交流电压最高挡）。', ana:'欧姆挡刻度不均匀，中值附近读数误差最小。'},

/* ---- 第十二章 ---- */
{id:'q1201', ch:'ch12', sec:'s12-1', type:'计算', stem:'一台电动机线圈电阻 0.4 Ω，两端电压 220 V，通过电流 5 A。求发热功率与对外做功的功率。', ans:'P热 = I²R = 25×0.4 = 10 W；P电 = UI = 1100 W；P机 = P电−P热 = 1090 W。', ana:'电动机是非纯电阻电路：P电 = P机 + P热，P热=I²R，不可用 U²/R 算总功率。'},
{id:'q1202', ch:'ch12', sec:'s12-1', type:'计算', stem:'电饭锅电路（图 12.1-4）中，S 接通时加热、断开时保温，保温功率恰为加热功率的一半。求两电阻之比 R₁:R₂。', ans:'加热：P = U²/R₂；保温：P′ = U²/(R₁+R₂)。P′ = P/2 → R₁+R₂ = 2R₂ → R₁:R₂ = 1:1。', ana:'S 接通时 R₁ 被短路，只有 R₂ 工作；断开时两电阻串联。'},
{id:'q1203', ch:'ch12', sec:'s12-2', type:'计算', stem:'手电筒中两节干电池（每节 1.5 V）串联，灯泡正常发光时两端电压 2.2 V、电流 0.25 A。求每节电池的内阻。', ans:'总电动势 E=3 V，总内阻 r=(E−U)/I = (3−2.2)/0.25 = 3.2 Ω，每节 r₀ = 1.6 Ω。', ana:'闭合电路欧姆定律：E = U + Ir。'},
{id:'q1204', ch:'ch12', sec:'s12-2', type:'计算', stem:'电源电动势 4.5 V，外接 4 Ω 电阻时路端电压为 4 V。（1）求电源内阻；（2）再并联一只 6 Ω 电阻后求路端电压；（3）再串联一只 6 Ω 电阻后求路端电压。', ans:'（1）I=4/4=1 A，r=(4.5−4)/1=0.5 Ω。（2）R外=4×6/10=2.4 Ω，I=4.5/2.9≈1.55 A，U=4.5−1.55×0.5≈3.72 V。（3）R外=10 Ω，I=4.5/10.5≈0.43 A，U=4.5−0.21≈4.29 V。', ana:'并联总电阻变小 → 电流变大 → 路端电压降低（灯泡并联变暗的原因）；串联总电阻变大 → 路端电压升高。'},
{id:'q1205', ch:'ch12', sec:'s12-2', type:'选择', stem:'电源电动势 E=3 V，内阻 r=1 Ω，当外电阻 R 由很大逐渐减小到 0 的过程中（　）A. 路端电压一直增大　B. 电流一直增大，路端电压一直减小　C. 内电压先增大后减小　D. 电流先减小后增大', opts:['A','B','C','D'], ans:'B', ana:'I=E/(R+r) 随 R 减小而增大；U=E−Ir 随 I 增大而减小。'},
{id:'q1206', ch:'ch12', sec:'s12-3', type:'概念', stem:'用伏安法测电源电动势和内阻，为什么要多次测量并作 U-I 图像？如何从图像读出 E 和 r？', ans:'两次测量偶然误差大，多次测量并作图可利用所有数据减小误差。U-I 图线为直线，与纵轴交点为电动势 E，斜率绝对值 |ΔU/ΔI| 为内阻 r。', ana:'U = −rI + E 是一次函数；为放大图像，电压轴起点通常不从 0 开始。'},
{id:'q1207', ch:'ch12', sec:'s12-3', type:'概念', stem:'测干电池电动势和内阻实验中，为什么电压 U 随电流 I 变化不明显？怎样改进才能让图像更精确？', ans:'干电池内阻小，I 变化时 U 变化小，图像斜率小、读数误差大。改进：电压轴不从 0 开始（选择合适起点放大刻度），或使用旧电池（内阻较大）测量。', ana:'图像倾斜越明显，内阻测量越准。'},
{id:'q1208', ch:'ch12', sec:'s12-4', type:'计算', stem:'某地平均风速 14 m/s，风的密度 1.3 kg/m³，风力发电机的受风面积 400 m²，能量转化效率 20%。求发电机的输出功率。', ans:'空气动能功率 P = ½ρSv³ = 0.5×1.3×400×14³ ≈ 7.1×10⁵ W；输出 P′ = 20%×P ≈ 1.4×10⁵ W。', ana:'单位时间通过截面的空气动能即功率：½ρSv³。'},
{id:'q1209', ch:'ch12', sec:'s12-4', type:'计算', stem:'太阳能热水器受光面积 2 m²，太阳光平均辐射强度 7×10³ J/(m²·s)，光照 4 h 内热水器吸收太阳能 20%。求水吸收的热量。', ans:'E总 = 7×10³×2×4×3600 = 2.016×10⁸ J；Q = 20%×E总 ≈ 4.0×10⁷ J。', ana:'辐射强度 × 面积 × 时间 = 入射总能量；注意 4 h = 4×3600 s。'},
{id:'q1210', ch:'ch12', sec:'s12-4', type:'概念', stem:'能量既然是守恒的，为什么还要节约能源？', ans:'能量在转化和转移过程中总量不变，但可利用的品质会降低（能量耗散），比如内能散失到环境中很难再被收集利用。节约能源的本质是节约高品质能源，同时减少环境污染。', ana:'能量守恒是从数量上讲；能量耗散是从品质与方向性上讲。'},

/* ---- 第十三章 ---- */
{id:'q1301', ch:'ch13', sec:'s13-1', type:'概念', stem:'奥斯特实验说明了什么？它的意义是什么？', ans:'通电导线能使小磁针偏转——电流周围存在磁场，即电流的磁效应。它首次揭示了电与磁的联系，开启了对电磁统一的研究。', ana:'1820 年奥斯特偶然发现，是电磁学的里程碑事件。'},
{id:'q1302', ch:'ch13', sec:'s13-1', type:'选择', stem:'关于磁感线，下列说法正确的是（　）A. 磁感线是客观存在的曲线　B. 磁感线从磁体 S 极出发到 N 极终止　C. 磁感线的疏密表示磁场的强弱　D. 磁感线与电场线一样从正电荷出发', opts:['A','B','C','D'], ans:'C', ana:'磁感线是假想的闭合曲线（外部 N→S，内部 S→N），疏密表示强弱，与电场线（非闭合）不同。'},
{id:'q1303', ch:'ch13', sec:'s13-1', type:'概念', stem:'用右手螺旋定则判断：通电直导线中电流方向竖直向上，导线右侧的磁场方向如何？', ans:'右手握住导线、拇指指向上（电流方向），四指弯曲方向即磁感线环绕方向——在导线右侧，四指指向纸面外，故磁场方向垂直纸面向外。', ana:'直线电流的磁感线是同心圆，方向用右手安培定则判断。'},
{id:'q1304', ch:'ch13', sec:'s13-2', type:'计算', stem:'在匀强磁场中，长 40 cm、通有 20 A 电流的直导线与磁场方向垂直，受到的磁场力为 0.015 N。求磁感应强度 B。', ans:'B = F/(IL) = 0.015/(20×0.4) = 1.875×10⁻³ T。', ana:'定义式 B=F/IL，导线必须与磁场垂直。'},
{id:'q1305', ch:'ch13', sec:'s13-2', type:'计算', stem:'匀强磁场 B=0.2 T，一个面积 0.5 m² 的平面与磁场方向成 30°。求穿过该平面的磁通量。', ans:'平面与磁场成 30°，则法线与磁场成 60°。Φ = BS·cosθ = 0.2×0.5×cos60° = 0.05 Wb。', ana:'Φ=BScosθ，θ 是平面法线与 B 的夹角；也可先取垂直投影面积。'},
{id:'q1306', ch:'ch13', sec:'s13-3', type:'选择', stem:'下列情况中能产生感应电流的是（　）A. 闭合线圈在匀强磁场中沿磁感线方向移动　B. 闭合线圈在匀强磁场中垂直磁感线方向平移　C. 线圈在磁场中转动，使穿过线圈的磁通量变化　D. 线圈静止在匀强磁场中', opts:['A','B','C','D'], ans:'C', ana:'产生感应电流的条件：穿过闭合回路的磁通量发生变化。沿磁感线平移或垂直平移（匀强场）Φ 均不变。'},
{id:'q1307', ch:'ch13', sec:'s13-3', type:'概念', stem:'法拉第发现电磁感应经历了怎样的过程？产生感应电流的本质条件是什么？', ans:'法拉第受奥斯特发现启发，历时 10 年探索，1831 年用铁环双线圈实验获得感应电流。本质条件：穿过闭合导体回路的磁通量发生变化（B 变、S 变或夹角变）。', ana:'切割磁感线只是 Φ 变化的一种情形。'},
{id:'q1308', ch:'ch13', sec:'s13-4', type:'计算', stem:'微波炉的工作频率为 2450 MHz，求其电磁波的波长。', ans:'λ = c/f = 3×10⁸/(2.45×10⁹) ≈ 0.12 m。', ana:'c=λf，注意 1 MHz=10⁶ Hz。'},
{id:'q1309', ch:'ch13', sec:'s13-4', type:'计算', stem:'"天宫一号"轨道半径约为 6740 km，地面接收站离它约 340 km。电磁波从空间站传到接收站需要多长时间？', ans:'t = s/c = 3.4×10⁵/3×10⁸ ≈ 1.1×10⁻³ s。', ana:'电磁波在真空中以光速传播。'},
{id:'q1310', ch:'ch13', sec:'s13-4', type:'概念', stem:'按波长从长到短，电磁波谱的组成是怎样的？各举一个应用。', ans:'无线电波（广播、通信）→ 红外线（加热、理疗）→ 可见光（照明、光通信）→ 紫外线（消毒）→ X 射线（医学诊断）→ γ 射线（治疗肿瘤/伽马刀）。', ana:'不同波段波长不同、特性不同，应用各异。'},
{id:'q1311', ch:'ch13', sec:'s13-5', type:'计算', stem:'某光子能量为 7.4×10⁻¹⁹ J，求其频率（h=6.626×10⁻³⁴ J·s）。', ans:'ν = ε/h = 7.4×10⁻¹⁹/6.626×10⁻³⁴ ≈ 1.1×10¹⁵ Hz。', ana:'能量子公式 ε=hν。'},
{id:'q1312', ch:'ch13', sec:'s13-5', type:'计算', stem:'某激光器发出波长 632.8 nm 的激光，功率 18 mW。求每个光子的能量及每秒发射的光子数。', ans:'E = hc/λ = 6.626×10⁻³⁴×3×10⁸/(632.8×10⁻⁹) ≈ 3.1×10⁻¹⁹ J；N = P/E = 18×10⁻³/3.1×10⁻¹⁹ ≈ 5.7×10¹⁶ 个。', ana:'光子能量 E=hν=hc/λ；每秒光子数 = 功率/单光子能量。'},
{id:'q1313', ch:'ch13', sec:'s13-5', type:'概念', stem:'为什么原子的发射光谱是一些分立的亮线，而不是连续光谱？', ans:'原子能量是量子化的（能级分立），原子从高能级向低能级跃迁时放出光子，光子能量等于两个能级之差，只能取若干分立值，因此光谱是分立的亮线。', ana:'能级分立 → 光子能量分立 → 光谱分立。'}
];

const DEMOS = {};        // id -> meta
const activeDemos = [];  // running instances
let demoTick = 0;

function regDemo(id, meta, setup){ DEMOS[id] = Object.assign({id}, meta, {setup}); }

const ICO = {
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>'
};

function addSlider(ctrl, o){
  const lab = document.createElement('label');
  lab.innerHTML = `<span>${o.label}</span>`;
  const inp = document.createElement('input');
  inp.type='range'; inp.min=o.min; inp.max=o.max; inp.step=o.step; inp.value=o.val;
  inp.style.width = o.w||'120px';
  const val = document.createElement('span'); val.className='val'; val.textContent = (o.fmt?o.fmt(o.val):o.val) + (o.unit||'');
  lab.appendChild(inp); lab.appendChild(val); ctrl.appendChild(lab);
  inp.addEventListener('input', ()=>{ const v = parseFloat(inp.value); val.textContent=(o.fmt?o.fmt(v):v)+(o.unit||''); o.on(v); });
  return {inp, val, get:()=>parseFloat(inp.value)};
}
function addBtn(ctrl, label, fn, opts){
  const b = document.createElement('button'); b.className='btn-mini'+(opts&&opts.act?' act':''); b.textContent=label;
  b.addEventListener('click', fn); ctrl.appendChild(b); return b;
}
function addSelect(ctrl, label, opts, fn){
  const lab = document.createElement('label'); lab.innerHTML=`<span>${label}</span>`;
  const sel = document.createElement('select');
  opts.forEach(([v,t])=>{ const op=document.createElement('option'); op.value=v; op.textContent=t; sel.appendChild(op); });
  sel.value = opts[0][0]; lab.appendChild(sel); ctrl.appendChild(lab);
  sel.addEventListener('change', ()=>fn(sel.value)); return sel;
}
function setStat(api, html){ const s=api.el && api.el.querySelector? api.el.querySelector('.demo-stat'):null; if(s) s.innerHTML = html; }
function canvasCtx(canvas, w, h){ canvas.width=w||920; canvas.height=h||380; return canvas.getContext('2d'); }

function startDemos(){ if(activeDemos.length && !demoTick){ loop(); } }
function loop(){
  demoTick = requestAnimationFrame(loop);
  for(let i=activeDemos.length-1;i>=0;i--){
    const d = activeDemos[i];
    if(!d._alive){ activeDemos.splice(i,1); continue; }
    if(!d._paused){ try{ d.draw && d.draw(); }catch(e){} }
  }
}
function renderDemo(id, host){
  const d = DEMOS[id]; if(!d) return null;
  const el = document.createElement('div'); el.className='demo-embed';
  el.innerHTML = `<div class="demo-head">${ICO.play}<span>${d.title}</span></div><canvas width="920" height="380"></canvas><div class="demo-ctrl"></div><div class="demo-stat"></div>`;
  host.appendChild(el);
  const canvas = el.querySelector('canvas'), ctrl = el.querySelector('.demo-ctrl');
  const api = Object.assign({el, canvas, ctrl, ctx: canvas.getContext('2d'), paused:false}, d.setup({el, canvas, ctrl}));
  api._alive = true; api._paused = false;
  activeDemos.push(api);
  if(api.start) api.start();
  api.draw && api.draw();
  startDemos();
  return api;
}
function stopAllDemos(){ activeDemos.forEach(d=>d._alive=false); activeDemos.length=0; }

/* ---------- 演示 1：静电感应 ---------- */
regDemo('demo-induction', {title:'静电感应 · 电荷的转移与重新分布', chapter:'ch9', desc:'带电体靠近导体时，自由电子定向移动，近端带异种电荷、远端带同种电荷。拖动滑块观察感应过程，点击"分开"看两导体带电情况。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  let d = 300, split = false, t = 0;
  addSlider(ctrl, {label:'带电体距离', min:140, max:420, step:4, val:300, on:v=>d=v});
  addBtn(ctrl, '分开两导体', ()=>{ split = true; });
  addBtn(ctrl, '重新接触', ()=>{ split = false; });
  const W = canvas.width, H = canvas.height;
  return {
    draw(){
      t += 0.02;
      ctx.clearRect(0,0,W,H);
      // 背景网格
      ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
      for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // 带电棒（正电）
      const rodX = d, rodY = H*0.5;
      ctx.fillStyle='#F87171';
      ctx.beginPath(); ctx.roundRect(rodX-14, rodY-120, 28, 240, 12); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
      ctx.fillText('+ + +', rodX, rodY+8);
      // 两导体（接触或分开）
      const gap = split ? 36 : 6;
      const b1 = {x: W*0.32, y: rodY-95, w: 120, h: 190};
      const b2 = {x: b1.x + b1.w + gap, y: rodY-95, w: 120, h: 190};
      // 导体金属
      [b1,b2].forEach((b,i)=>{
        ctx.fillStyle = '#334155'; ctx.strokeStyle='#64748B'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,10); ctx.fill(); ctx.stroke();
      });
      // 电子（自由电子动画：棒靠近时向左侧集聚）
      const n = 26; const eR = 5;
      for(let i=0;i<n;i++){
        const baseX = split ? (i<n/2? b1.x+15+ (i%13)*8 : b2.x+15+ (i%13)*8) : b1.x+15+(i%26)*8;
        const baseY = b1.y+18+(i*17)%154;
        let ex = baseX, ey = baseY;
        const dist = Math.abs(ex-rodX);
        if(!split && dist < 200 && ex < rodX){ // 电子受正电荷吸引向棒侧（左侧导体近棒端）
          const pull = (1 - dist/200)*1.0;
          ex -= pull*26;
        }
        ctx.fillStyle='#7DD3FC';
        ctx.beginPath(); ctx.arc(ex, ey, eR, 0, 7); ctx.fill();
      }
      // 感应电荷标注
      ctx.font='bold 15px sans-serif';
      if(!split){
        ctx.fillStyle='#F87171'; ctx.fillText('− − −', b1.x+30, b1.y-12); // 近端负电（聚集电子）
        ctx.fillStyle='#86EFAC'; ctx.fillText('+ + +', b2.x+b2.w-30, b2.y-12); // 远端正电
      }else{
        ctx.fillStyle='#F87171'; ctx.fillText('−', b1.x+b1.w/2, b1.y-12);
        ctx.fillStyle='#86EFAC'; ctx.fillText('+', b2.x+b2.w/2, b2.y-12);
      }
      ctx.fillStyle='#C7D6EE'; ctx.font='13px sans-serif';
      ctx.fillText('带电体 C（正电）', rodX, rodY-140);
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif';
      ctx.fillText(split? '导体 A 带负电 · 导体 B 带正电':'电子向靠近 C 的一端聚集', W/2, H-16);
      setStat(this, `<span>自由电子数 <b>26</b> 个</span><span>状态 <b>${split?'已分开':'接触中'}</b></span><span>近端电荷 <b>负</b></span><span>远端电荷 <b>正</b></span>`);
    }
  };
});

/* ---------- 演示 2：库仑定律 ---------- */
regDemo('demo-coulomb', {title:'库仑定律 · 静电力与 q₁、q₂、r 的关系', chapter:'ch9', desc:'调节两个点电荷的电荷量与距离，观察静电力的大小与方向变化（F = kq₁q₂/r²）。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {q1:3, q2:2, r:300, s1:1, s2:1};
  addSlider(ctrl, {label:'q₁ (×10⁻⁹ C)', min:1, max:9, step:1, val:3, on:v=>st.q1=v});
  addSlider(ctrl, {label:'q₂ (×10⁻⁹ C)', min:1, max:9, step:1, val:2, on:v=>st.q2=v});
  addSlider(ctrl, {label:'距离 r (m)', min:100, max:420, step:5, val:300, on:v=>st.r=v});
  addBtn(ctrl, 'q₁ 变负', ()=>{ st.s1*=-1; });
  addBtn(ctrl, 'q₂ 变负', ()=>{ st.s2*=-1; });
  const W = canvas.width, H = canvas.height, cy = H/2;
  const k = 9.0;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      const x1 = 200, x2 = Math.min(x1 + st.r, W-80);
      const rM = (x2-x1)/1;
      const F = k*st.q1*st.q2/(rM*rM)*1e4; // 缩放显示
      const drawCharge=(x, q, s, color)=>{
        const r = 22;
        const grad = ctx.createRadialGradient(x-6,cy-6,4,x,cy,r);
        grad.addColorStop(0,'#fff'); grad.addColorStop(1,color);
        ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,cy,r,0,7); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#0E1728'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
        ctx.fillText(s>0?'+':'−', x, cy+7);
        ctx.fillStyle='#DCE6F7'; ctx.font='13px sans-serif';
        ctx.fillText(`q = ${s>0?'':'−'}${q}×10⁻⁹C`, x, cy+52);
      };
      drawCharge(x1, st.q1, st.s1, '#F87171');
      drawCharge(x2, st.q2, st.s2, '#7DD3FC');
      // 连线
      ctx.strokeStyle='#475569'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x1,cy); ctx.lineTo(x2,cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif';
      ctx.fillText(`r = ${(rM).toFixed(0)} m`, (x1+x2)/2, cy-26);
      // 力箭头（斥力：各自远离；引力：互相靠近）
      const rep = st.s1*st.s2>0;
      const dir1 = rep? -1:1, dir2 = rep? 1:-1;
      const len = Math.min(90, Math.log10(1+F*1.4)*30+10);
      const arrow=(x,y,dir,len,color)=>{
        ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*len,y); ctx.stroke();
        const a = dir>0?0:Math.PI, s=12;
        ctx.beginPath(); ctx.moveTo(x+dir*len,y); ctx.lineTo(x+dir*len-s*Math.cos(a-0.4), y-s*Math.sin(a-0.4)); ctx.lineTo(x+dir*len-s*Math.cos(a+0.4), y-s*Math.sin(a+0.4)); ctx.closePath(); ctx.fill();
        ctx.font='bold 14px sans-serif'; ctx.fillStyle='#FDE68A';
        ctx.fillText(`F=${(F).toFixed(2)}×10⁻⁹N`, x+dir*len*0.5-30, y-16);
      };
      arrow(x1-30, cy, dir1, len, '#F87171');
      arrow(x2+30, cy, dir2, len, '#7DD3FC');
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText(rep? '同号相斥':'异号相吸', W/2, H-18);
      setStat(this, `<span>静电力常量 k <b>9.0×10⁹</b></span><span>F = kq₁q₂/r²</span><span>方向 <b>${rep?'互相排斥':'互相吸引'}</b></span>`);
    }
  };
});

/* ---------- 演示 3：电场线 ---------- */
regDemo('demo-field', {title:'电场线与电场强度 · 五种典型电场', chapter:'ch9', desc:'切换场源类型，观察电场线分布。点按画面任意位置放置试探电荷，显示该点电场强度方向与大小。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {type:'dipole', px:null, py:null};
  const types = [['singleP','正点电荷'],['singleN','负点电荷'],['dipole','等量异种电荷'],['same','等量同种电荷'],['uniform','匀强电场']];
  addSelect(ctrl, '场源类型', types, v=>st.type=v);
  const W = canvas.width, H = canvas.height;
  const charges = [
    {x: W*0.34, y: H*0.5, q: 1, label:'+'},
    {x: W*0.66, y: H*0.5, q: -1, label:'−'}
  ];
  const field = (x,y)=>{
    let Ex=0, Ey=0;
    if(st.type==='uniform'){ return {x: 1, y: 0}; }
    if(st.type==='singleP'||st.type==='singleN'){
      const c = {x: W*0.5, y: H*0.5, q: st.type==='singleP'?1:-1};
      const dx=x-c.x, dy=y-c.y, r2=dx*dx+dy*dy+1, r=Math.sqrt(r2);
      const s=c.q/(r2); return {x: s*dx/r, y: s*dy/r};
    }
    if(st.type==='same'){
      const c1=charges[0], c2=charges[1];
      const dx1=x-c1.x, dy1=y-c1.y, r1=Math.sqrt(dx1*dx1+dy1*dy1+1);
      const dx2=x-c2.x, dy2=y-c2.y, r2=Math.sqrt(dx2*dx2+dy2*dy2+1);
      return {x: dx1/(r1*r1*r1)+dx2/(r2*r2*r2), y: dy1/(r1*r1*r1)+dy2/(r2*r2*r2)};
    }
    const c1=charges[0], c2=charges[1];
    const dx1=x-c1.x, dy1=y-c1.y, r1=Math.sqrt(dx1*dx1+dy1*dy1+1);
    const dx2=x-c2.x, dy2=y-c2.y, r2=Math.sqrt(dx2*dx2+dy2*dy2+1);
    return {x: dx1/(r1*r1*r1)-dx2/(r2*r2*r2), y: dy1/(r1*r1*r1)-dy2/(r2*r2*r2)};
  };
  canvas.addEventListener('click', e=>{
    const rect = canvas.getBoundingClientRect();
    st.px = (e.clientX-rect.left)/rect.width*W; st.py = (e.clientY-rect.top)/rect.height*H;
  });
  const drawChargeAt=(c, r)=>{
    const grad=ctx.createRadialGradient(c.x-3,c.y-3,2,c.x,c.y,r);
    grad.addColorStop(0,'#fff'); grad.addColorStop(1, c.q>0?'#F87171':'#7DD3FC');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.fill();
    ctx.fillStyle='#0E1728'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.q>0?'+':'−', c.x, c.y+6);
  };
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,.05)';
      for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // 电场线（流线追踪）
      const fieldLines = [];
      if(st.type==='uniform'){
        for(let i=0;i<12;i++){ fieldLines.push([[0, 30+i*30],[W, 30+i*30]]); }
      }else if(st.type==='singleP'||st.type==='singleN'){
        const c={x:W*0.5,y:H*0.5}; const n=24;
        for(let i=0;i<n;i++){
          const a=i/n*Math.PI*2; const pts=[];
          let x=c.x+Math.cos(a)*34, y=c.y+Math.sin(a)*34;
          const dir = st.type==='singleP'?1:-1;
          for(let s=0;s<90;s++){
            pts.push([x,y]);
            const f=field(x,y), m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
            x+=f.x/m*4*dir; y+=f.y/m*4*dir;
            if(x<0||x>W||y<0||y>H) break;
          }
          fieldLines.push(pts);
        }
      }else{
        const c1=charges[0], c2=charges[1];
        const seeds=[]; const n=20;
        for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; seeds.push([c1.x+Math.cos(a)*30, c1.y+Math.sin(a)*30]); }
        for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; seeds.push([c2.x+Math.cos(a)*30, c2.y+Math.sin(a)*30]); }
        seeds.forEach(([sx,sy])=>{
          const pts=[[sx,sy]]; let x=sx,y=sy;
          for(let s=0;s<160;s++){
            const f=field(x,y), m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
            x+=f.x/m*3.5; y+=f.y/m*3.5;
            if(x<0||x>W||y<0||y>H) break;
            if(Math.sqrt((x-c1.x)**2+(y-c1.y)**2)<20||Math.sqrt((x-c2.x)**2+(y-c2.y)**2)<20) break;
            pts.push([x,y]);
          }
          fieldLines.push(pts);
        });
      }
      ctx.lineWidth=1.6; ctx.strokeStyle=st.type==='singleN'?'#67E8F9':'#93C5FD';
      fieldLines.forEach(pts=>{
        ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
      });
      // 场源
      if(st.type==='singleP') drawChargeAt({x:W*0.5,y:H*0.5,q:1},20);
      if(st.type==='singleN') drawChargeAt({x:W*0.5,y:H*0.5,q:-1},20);
      if(st.type==='dipole'){ drawChargeAt(charges[0],20); drawChargeAt(charges[1],20); }
      if(st.type==='same'){ drawChargeAt({x:charges[0].x,y:charges[0].y,q:1},20); drawChargeAt({x:charges[1].x,y:charges[1].y,q:1},20); }
      if(st.type==='uniform'){
        ctx.fillStyle='#F87171'; ctx.beginPath(); ctx.roundRect(20,20,14,H-40,4); ctx.fill();
        ctx.fillStyle='#67E8F9'; ctx.beginPath(); ctx.roundRect(W-34,20,14,H-40,4); ctx.fill();
      }
      // 试探电荷
      if(st.px!==null){
        const f=field(st.px,st.py), m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
        const L=46*Math.min(1,m*60);
        ctx.strokeStyle='#FDE68A'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(st.px,st.py); ctx.lineTo(st.px+f.x/m*L, st.py+f.y/m*L); ctx.stroke();
        const a=Math.atan2(f.y,f.x), s=12;
        ctx.fillStyle='#FDE68A';
        ctx.beginPath(); ctx.moveTo(st.px+f.x/m*L,st.py+f.y/m*L);
        ctx.lineTo(st.px+f.x/m*L-s*Math.cos(a-0.42),st.py+f.y/m*L-s*Math.sin(a-0.42));
        ctx.lineTo(st.px+f.x/m*L-s*Math.cos(a+0.42),st.py+f.y/m*L-s*Math.sin(a+0.42));
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#FDE68A'; ctx.font='12.5px sans-serif'; ctx.textAlign='center';
        ctx.fillText(`E 方向 (${st.type==='uniform'?'水平向右':f.x>0?'向右':'向左'})`, st.px, st.py-16);
        setStat(this, `<span>场源 <b>${types.find(t=>t[0]===st.type)[1]}</b></span><span>场强方向 <b>${st.type==='uniform'?'水平向右':'沿电场线切线'}</b></span><span>疏密 <b>表示强弱</b></span>`);
      }else{
        setStat(this, `<span>场源 <b>${types.find(t=>t[0]===st.type)[1]}</b></span><span>提示 <b>点击画面放置试探电荷</b></span>`);
      }
    }
  };
});

/* ---------- 演示 4：静电屏蔽 ---------- */
regDemo('demo-shield', {title:'静电屏蔽 · 导体壳内的电场', chapter:'ch9', desc:'外电场中的导体达到静电平衡后，内部电场处处为 0；金属壳/金属网能屏蔽外电场。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  let shield = false;
  addBtn(ctrl, '插入金属罩', ()=>{ shield = true; });
  addBtn(ctrl, '移走金属罩', ()=>{ shield = false; });
  const W = canvas.width, H = canvas.height;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      const cy = H*0.5, cx = W*0.5;
      // 匀强电场背景箭头（左侧）
      ctx.strokeStyle='rgba(147,167,200,.55)'; ctx.lineWidth=1.8;
      for(let y=60;y<H-40;y+=44){
        ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-30,y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(W-38,y-6); ctx.lineTo(W-30,y); ctx.lineTo(W-38,y+6); ctx.stroke();
      }
      ctx.fillStyle='#93A7C8'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('匀强外电场 E', W-90, 36);
      if(shield){
        // 金属罩（带空腔）
        ctx.fillStyle='rgba(71,85,105,.35)';
        ctx.beginPath(); ctx.roundRect(cx-110, cy-120, 220, 240, 14); ctx.fill();
        ctx.strokeStyle='#94A3B8'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.roundRect(cx-110, cy-120, 220, 240, 14); ctx.stroke();
        // 空腔（无电场）
        ctx.fillStyle='#0E1728';
        ctx.beginPath(); ctx.roundRect(cx-72, cy-82, 144, 164, 10); ctx.fill();
        ctx.strokeStyle='#64748B'; ctx.stroke();
        // 外部场线绕行示意
        ctx.strokeStyle='rgba(147,167,200,.6)'; ctx.lineWidth=1.8;
        for(let i=0;i<5;i++){

regDemo('demo-eq', {title:'等势面与电场线 · 垂直相伴', chapter:'ch10', desc:'虚线为等势面（相邻等势面间电势差相同），实线为电场线。等势面与电场线垂直，且等势面越密处场强越大。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {type:'dipole'};
  addSelect(ctrl, '场源', [['dipole','等量异种电荷'],['single','点电荷'],['uniform','匀强电场']], v=>st.type=v);
  const W = canvas.width, H = canvas.height;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      const cx = W/2, cy = H/2;
      // 等势面（虚线）
      ctx.strokeStyle='#F0ABFC'; ctx.lineWidth=1.6; ctx.setLineDash([7,6]);
      if(st.type==='uniform'){
        for(let i=-4;i<=4;i++){
          ctx.beginPath(); ctx.moveTo(cx+i*72, 40); ctx.lineTo(cx+i*72, H-40); ctx.stroke();
        }
      }else if(st.type==='single'){
        for(let r=1;r<=5;r++){
          ctx.beginPath(); ctx.arc(cx,cy,r*52,0,7); ctx.stroke();
        }
      }else{
        // 双曲线族近似：扫描场求解等势（简单取 r1-r2=const 近似画）
        for(let v=-3;v<=3;v++){
          ctx.beginPath();
          for(let a=0;a<=Math.PI*2;a+=0.02){
            const t=a;
            const r=150;
            const x=cx+Math.cos(t)*r*2.2, y=cy+Math.sin(t)*r*1.1;
            // 用 r1 - r2 近似等势：绘制椭圆族（教材示意）
            const ex=cx+Math.cos(t)*r*(1.05+Math.abs(v)*0.28), ey=cy+Math.sin(t)*r*(1.05+Math.abs(v)*0.28);
            if(t===0)ctx.moveTo(ex,ey); else ctx.lineTo(ex,ey);
          }
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);
      // 电场线（实线）
      ctx.strokeStyle='#93C5FD'; ctx.lineWidth=2;
      if(st.type==='uniform'){
        for(let i=0;i<9;i++){ ctx.beginPath(); ctx.moveTo(60,60+i*40); ctx.lineTo(W-60,60+i*40); ctx.stroke(); }
      }else if(st.type==='single'){
        for(let i=0;i<24;i++){ const a=i/24*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*52,cy+Math.sin(a)*52); ctx.lineTo(cx+Math.cos(a)*430,cy+Math.sin(a)*430); ctx.stroke(); }
        const grad=ctx.createRadialGradient(cx-5,cy-5,3,cx,cy,22);
        grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#F87171');
        ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,22,0,7); ctx.fill();
        ctx.fillStyle='#0E1728'; ctx.font='bold 17px sans-serif'; ctx.textAlign='center';
        ctx.fillText('+', cx, cy+6);
      }else{
        const c1={x:W*0.32,y:cy,q:1}, c2={x:W*0.68,y:cy,q:-1};
        const field=(x,y)=>{
          const dx1=x-c1.x,dy1=y-c1.y,r1=Math.sqrt(dx1*dx1+dy1*dy1+1);
          const dx2=x-c2.x,dy2=y-c2.y,r2=Math.sqrt(dx2*dx2+dy2*dy2+1);
          return {x:dx1/(r1*r1*r1)-dx2/(r2*r2*r2), y:dy1/(r1*r1*r1)-dy2/(r2*r2*r2)};
        };
        for(let i=0;i<16;i++){
          const a=i/16*Math.PI*2;
          const seeds=[[c1.x+Math.cos(a)*26,c1.y+Math.sin(a)*26],[c2.x+Math.cos(a)*26,c2.y+Math.sin(a)*26]];
          seeds.forEach(([sx,sy])=>{
            ctx.beginPath(); let x=sx,y=sy; ctx.moveTo(x,y);
            for(let s=0;s<140;s++){
              const f=field(x,y),m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
              x+=f.x/m*3.4; y+=f.y/m*3.4;
              if(x<0||x>W||y<0||y>H)break;
              if(Math.sqrt((x-c1.x)**2+(y-c1.y)**2)<18||Math.sqrt((x-c2.x)**2+(y-c2.y)**2)<18)break;
              ctx.lineTo(x,y);
            }
            ctx.stroke();
          });
        }
        const drawC=(c,label)=>{
          const g=ctx.createRadialGradient(c.x-4,c.y-4,2,c.x,c.y,20);
          g.addColorStop(0,'#fff'); g.addColorStop(1,label==='+'?'#F87171':'#7DD3FC');
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,20,0,7); ctx.fill();
          ctx.fillStyle='#0E1728'; ctx.font='bold 16px sans-serif';
          ctx.fillText(label, c.x, c.y+6);
        };
        drawC(c1,'+'); drawC(c2,'−');
      }
      // 图例
      ctx.font='12.5px sans-serif';
      ctx.strokeStyle='#F0ABFC'; ctx.setLineDash([7,6]); ctx.beginPath(); ctx.moveTo(24,26); ctx.lineTo(70,26); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#C7D6EE'; ctx.fillText('等势面（虚线）', 78, 31);
      ctx.strokeStyle='#93C5FD'; ctx.beginPath(); ctx.moveTo(24,48); ctx.lineTo(70,48); ctx.stroke();
      ctx.fillText('电场线（实线）', 78, 53);
      setStat(this, `<span>等势面 <b>⊥ 电场线</b></span><span>电场线 <b>高电势 → 低电势</b></span><span>等势面疏密 <b>反映场强</b></span>`);
    }
  };
});

function({el, canvas, ctrl}){

});

/* ---------- 演示 11：伏安特性 ---------- */
regDemo('demo-resistance', {title:'导体的电阻 · 伏安特性曲线', chapter:'ch11', desc:'电阻 R=U/I 由伏安特性曲线的斜率反映。对比线性元件与非线性元件（二极管）的 I-U 图像。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {R:3, type:'linear', t:0};
  addSlider(ctrl, {label:'电阻 R (Ω)', min:1, max:6, step:0.5, val:3, on:v=>st.R=v});
  addBtn(ctrl, '线性元件', ()=>{ st.type='linear'; });
  addBtn(ctrl, '二极管（非线性）', ()=>{ st.type='diode'; });
  const W = canvas.width, H = canvas.height;
  const ox=110, oy=H-70, kx=(W-160)/12, ky=170;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      st.t += 0.015;
      // 坐标轴
      ctx.strokeStyle='#64748B'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(ox,20); ctx.lineTo(ox,oy); ctx.lineTo(W-40,oy); ctx.stroke();
      ctx.fillStyle='#93A7C8'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('U/V', W-44, oy+20); ctx.fillText('I/A', 40, 26);
      for(let u=0;u<=12;u+=2){ ctx.fillText(u, ox+u*kx, oy+20); ctx.beginPath(); ctx.moveTo(ox+u*kx,oy); ctx.lineTo(ox+u*kx,oy+4); ctx.stroke(); }
      for(let i=0;i<=5;i++){ ctx.fillText((i*0.5).toFixed(1), ox-30, oy-i*34+4); ctx.beginPath(); ctx.moveTo(ox,oy-i*34); ctx.lineTo(ox-4,oy-i*34); ctx.stroke(); }
      // 曲线
      ctx.strokeStyle='#FDE68A'; ctx.lineWidth=3;
      ctx.beginPath();
      if(st.type==='linear'){
        for(let u=0;u<=12;u+=0.2){
          const I = u/st.R;
          const x=ox+u*kx, y=oy-I*68;
          u===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
      }else{
        // 二极管 I-U（正向导通）
        for(let u=0;u<=12;u+=0.2){
          const I = u>0.6? Math.min(5,(u-0.6)*2.6+0.2) : (u<=0?0:u*0.12);
          const x=ox+u*kx, y=oy-I*68;
          u===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
      }
      ctx.stroke();
      // 当前工作点
      const Unow = 3+3*Math.sin(st.t*1.3);
      let Inow = st.type==='linear'? Unow/st.R : (Unow>0.6? Math.min(5,(Unow-0.6)*2.6+0.2):Unow*0.12);
      const xp=ox+Unow*kx, yp=oy-Inow*68;
      ctx.fillStyle='#F87171';
      ctx.beginPath(); ctx.arc(xp,yp,7,0,7); ctx.fill();
      ctx.strokeStyle='rgba(248,113,113,.5)'; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(xp,yp); ctx.lineTo(xp,oy); ctx.lineTo(ox,oy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#FDE68A'; ctx.font='bold 12px sans-serif';
      ctx.fillText(`U=${Unow.toFixed(1)}V, I=${Inow.toFixed(2)}A, R=U/I=${(Unow/Inow).toFixed(1)}Ω`, ox+40, 40);
      const Rnow = Unow/Inow;
      setStat(this, `<span>元件 <b>${st.type==='linear'?'线性（金属导体）':'非线性（二极管）'}</b></span><span>斜率 <b>${st.type==='linear'?'1/R':'不恒定'}</b></span><span>当前 R = <b>${Rnow.toFixed(1)} Ω</b></span><span>欧姆定律 <b>${st.type==='linear'?'适用':'不适用'}</b></span>`);
    }
  };
});

/* ---------- 演示 12：游标卡尺 ---------- */
regDemo('demo-vernier', {title:'游标卡尺读数 · 10 分度', chapter:'ch11', desc:'拖动游标尺，模拟游标卡尺读数：读数 = 主尺读数 + 游标对齐刻度 × 0.1 mm。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {pos:3, last:0};
  addSlider(ctrl, {label:'游标位置 (mm)', min:0, max:60, step:0.1, val:23.4, on:v=>st.pos=v});
  const W = canvas.width, H = canvas.height;
  const mainTop=100, vernTop=190, scale=8;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      const off = st.pos*scale;
      // 主尺
      ctx.fillStyle='#94A3B8'; ctx.fillRect(60, mainTop, W-140, 60);
      ctx.fillStyle='#0E1728'; ctx.fillRect(60, mainTop, W-140, 54);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      for(let mm=0;mm<=92;mm++){
        const x=60+mm*scale;
        ctx.beginPath(); ctx.moveTo(x,mainTop); ctx.lineTo(x,mainTop+(mm%10===0?22:14)); ctx.stroke();
        if(mm%10===0){ ctx.fillStyle='#E2E8F0'; ctx.font='bold 12px sans-serif'; ctx.fillText((mm/10)|0, x-4, mainTop+36); }
      }
      // 游标尺（10分度：9mm分成10格）
      ctx.fillStyle='#F59E0B';
      ctx.beginPath(); ctx.roundRect(60, vernTop, 10*scale, 64, 4); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(60,vernTop); ctx.lineTo(60,vernTop+64); ctx.stroke();
      for(let g=0;g<=10;g++){
        const x=60+g*scale*0.9;
        ctx.beginPath(); ctx.moveTo(x,vernTop); ctx.lineTo(x,vernTop+18); ctx.stroke();
      }
      // 游标相对主尺平移：以第0刻线为准 offset
      // 实际绘制：主尺不动，游标框整体平移 off
      // 由于上面已画好，这里重绘主尺+游标相对位移（简化：直接用 off 平移游标）
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#334155'; ctx.fillRect(60, mainTop, W-140, 60);
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2;
      for(let mm=0;mm<=92;mm++){
        const x=60+mm*scale;
        ctx.beginPath(); ctx.moveTo(x,mainTop); ctx.lineTo(x,mainTop+(mm%10===0?22:14)); ctx.stroke();
        if(mm%10===0){ ctx.fillStyle='#E2E8F0'; ctx.font='bold 12px sans-serif'; ctx.fillText((mm/10)|0, x-4, mainTop+36); }
      }
      // 游标（平移 off）
      const vx = 60+off;
      ctx.fillStyle='#F59E0B';
      ctx.beginPath(); ctx.roundRect(vx, vernTop, 10*scale, 64, 4); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(vx,vernTop); ctx.lineTo(vx,vernTop+64); ctx.stroke();
      for(let g=0;g<=10;g++){
        const x=vx+g*scale*0.9;
        ctx.beginPath(); ctx.moveTo(x,vernTop); ctx.lineTo(x,vernTop+18); ctx.stroke();
      }
      // 找对齐刻度
      let align=0, best=1e9;
      for(let g=0;g<=10;g++){
        const vx2 = vx+g*scale*0.9;
        const nearest = Math.round((vx2-60)/scale);
        const diff = Math.abs((vx2-60)-nearest*scale);
        if(diff<best){best=diff; align=g;}
      }
      // 读数
      const main = Math.floor(st.pos);
      const reading = main + align*0.1;
      ctx.fillStyle='#FDE68A'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`主尺 ${main}.0 mm + 游标 ${align}×0.1 mm`, W/2, vernTop+112);
      ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif';
      ctx.fillText(`读数 = ${reading.toFixed(1)} mm`, W/2, vernTop+148);
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif';
      ctx.fillText('游标零刻度线', vx+5*scale*0.45, vernTop-8);
      setStat(this, `<span>精度 <b>0.1 mm</b></span><span>对齐游标刻度 <b>第 ${align} 格</b></span><span>读数 <b>${reading.toFixed(1)} mm</b></span>`);
    }
  };
});

regDemo('demo-circuit', {title:'串联与并联 · 等效电阻与分配', chapter:'ch11', desc:'调节两个电阻并切换连接方式，观察等效电阻、电流与电压分配规律。'},

/* ---------- 演示 14：多用电表 ---------- */
regDemo('demo-multimeter', {title:'多用电表 · 欧姆挡读数', chapter:'ch11', desc:'欧姆挡刻度右小左大、不均匀。切换倍率，观察指针位置变化：读数 × 倍率 = 电阻值。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {R:200, mult:100, t:0};
  addSlider(ctrl, {label:'待测电阻 R (Ω)', min:10, max:1000, step:10, val:200, on:v=>st.R=v});
  addSelect(ctrl, '倍率', [['1','×1'],['10','×10'],['100','×100'],['1000','×1k']], v=>st.mult=parseInt(v));
  const W = canvas.width, H = canvas.height;
  const cx=W/2, cy=H/2, R=150;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      // 表盘
      ctx.fillStyle='#F8FAFC'; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
      ctx.strokeStyle='#1E293B'; ctx.lineWidth=3; ctx.stroke();
      // 欧姆刻度（右0左∞ 不均匀：r = 1/R 映射）
      const ticks=[[0,10],[50,8],[100,6],[200,5],[300,4.3],[500,3.7],[1000,3.2],[2000,2.9],[5000,2.6],[10000,2.45]];
      ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
      ticks.forEach(([val,pos])=>{
        const a = Math.PI*0.75 + (Math.PI*1.5)*(1-pos/10);
        const x=cx+Math.cos(a)*(R-30), y=cy+Math.sin(a)*(R-30);
        ctx.fillStyle='#1E293B';
        ctx.fillText(val>=1000? (val/1000)+'k':val, x, y);
        ctx.strokeStyle='#64748B';
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R-8), cy+Math.sin(a)*(R-8)); ctx.lineTo(cx+Math.cos(a)*(R-22), cy+Math.sin(a)*(R-22)); ctx.stroke();
      });
      // 指针位置（按 R/倍率 映射到刻度）
      const rRel = st.R/st.mult;
      const pos = Math.max(0, Math.min(10, 10/(1+rRel/160)*2.2)); // 模拟刻度映射
      const a = Math.PI*0.75 + (Math.PI*1.5)*(1-pos/10);
      ctx.strokeStyle='#DC2626'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*(R-36), cy+Math.sin(a)*(R-36)); ctx.stroke();
      ctx.fillStyle='#DC2626';
      ctx.beginPath(); ctx.arc(cx,cy,7,0,7); ctx.fill();
      // 标注
      ctx.fillStyle='#1E293B'; ctx.font='bold 13px sans-serif';
      ctx.fillText('Ω', cx+R-70, cy-50);
      ctx.fillStyle='#0F172A'; ctx.font='bold 18px sans-serif';
      ctx.fillText(`R = ${st.R} Ω（表盘 ${(rRel).toFixed(0)} × ${st.mult}）`, cx, cy+R+44);
      ctx.fillStyle='#64748B'; ctx.font='12px sans-serif';
      ctx.fillText('欧姆挡刻度：右小左大，不均匀', cx, cy+R+66);
      const rRead = st.R/st.mult;
      setStat(this, `<span>倍率 <b>×${st.mult}</b></span><span>表盘读数 <b>${rRead.toFixed(0)}</b></span><span>电阻值 = 读数×倍率 = <b>${st.R} Ω</b></span><span>指针最佳区域 <b>中值附近</b></span>`);
    }
  };
});

      const Q = I*I*R*st.t;
      const Pheat = I*I*R;
      const U = st.mode==='pure'? I*R : I*R+6;
      const P = U*I;
      // 电阻（加热丝）
      const zig=[]; for(let i=0;i<12;i++){ zig.push([cx-70+i*12, i%2? cy-26: cy+26]); }
      ctx.strokeStyle='#F97316'; ctx.lineWidth=3;
      ctx.beginPath(); zig.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
      ctx.fillStyle='#FDE68A'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`R=${R} Ω`, cx, cy+56);

      ctx.fillText(`I=${I} A`, cx-150, cy-54);

    }
  };
});

/* ---------- 演示 17：测电动势实验 ---------- */
regDemo('demo-battery', {title:'实验：电池电动势和内阻的测量', chapter:'ch12', desc:'点击"测量"获得一组 U、I 数据，多次测量后用 U-I 图像拟合直线：纵截距 = 电动势 E，斜率绝对值 = 内阻 r。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {E:1.5, r:0.8, pts:[], n:0};
  addBtn(ctrl, '测量一组数据', ()=>{
    const R = 1 + st.n*1.4;
    const I = st.E/(R+st.r), U = st.E-I*st.r;
    st.pts.push({I, U});
    st.n++;
    if(st.pts.length>8) st.pts.shift();
  });
  addBtn(ctrl, '清空数据', ()=>{ st.pts=[]; st.n=0; });
  const W = canvas.width, H = canvas.height;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      // 坐标轴（I 横、U 纵）
      const ox=90, oy=H-70, kx=(W-160)/2.2, ky=150/1.6;
      ctx.strokeStyle='#64748B'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(ox,40); ctx.lineTo(ox,oy); ctx.lineTo(W-50,oy); ctx.stroke();
      ctx.fillStyle='#93A7C8'; ctx.font='13px sans-serif'; ctx.textAlign='center';
      ctx.fillText('I/A', W-60, oy+22); ctx.fillText('U/V', 40, 34);
      for(let i=0;i<=4;i++){ ctx.fillText((i*0.5).toFixed(1), ox+i*kx*0.5, oy+20); }
      for(let i=0;i<=4;i++){ ctx.fillText((i*0.4).toFixed(1), ox-34, oy-i*ky*0.4+4); }
      // 拟合直线（若有点）
      let showLine=false, slope=0, b=0;
      if(st.pts.length>=2){
        const n=st.pts.length;
        let sx=0,sy=0,sxx=0,sxy=0;
        st.pts.forEach(p=>{sx+=p.I;sy+=p.U;sxx+=p.I*p.I;sxy+=p.I*p.U;});
        slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
        b=(sy-slope*sx)/n;
        showLine=true;
        const I1=0, I2=2.2;
        const U1=b, U2=b+slope*I2;
        ctx.strokeStyle='#34D399'; ctx.lineWidth=3; ctx.setLineDash([6,4]);
        ctx.beginPath();
        ctx.moveTo(ox+Math.max(0,Math.min(2.2,(b-U2)/slope))*kx, oy-U2*ky);
        ctx.lineTo(ox+I1*kx, oy-b*ky);
        ctx.stroke(); ctx.setLineDash([]);
      }
      // 数据点
      st.pts.forEach((p,i)=>{
        ctx.fillStyle = i===st.pts.length-1?'#FDE68A':'#7DD3FC';
        ctx.beginPath(); ctx.arc(ox+p.I*kx, oy-p.U*ky, 6, 0, 7); ctx.fill();
      });
      // 结果显示
      ctx.fillStyle='#FDE68A'; ctx.font='bold 14px sans-serif';
      if(showLine){
        const Er = b, rr = -slope;
        ctx.fillText(`E = ${Er.toFixed(2)} V（纵截距）`, ox+20, 44);
        ctx.fillText(`r = ${rr.toFixed(2)} Ω（斜率绝对值）`, ox+20, 70);
      }else if(st.pts.length===1){
        ctx.fillText('再测几组数据即可拟合直线', ox+20, 44);
      }else{
        ctx.fillText('点击"测量一组数据"开始实验（8 组以内）', ox+20, 44);
      }
      setStat(this, `<span>数据组数 <b>${st.pts.length}</b></span><span>原理 <b>E = U + Ir</b></span><span>图像 <b>U = −rI + E</b></span><span>多点拟合 <b>减小误差</b></span>`);
    }
  };
});

      ctx.fillText(`θ=${st.theta}°`, cx+44, cy-34);

      setStat(this, `<span>Φ = BS·cosθ = <b>${flux.toFixed(2)} Wb</b></span><span>θ=0° <b>Φ最大</b></span><span>θ=90° <b>Φ=0</b></span><span>B = Φ/S：<b>磁感应强度</b></span>`);
    }
  };
});

/* ---------- 演示 21：电磁感应 ---------- */
regDemo('demo-induction2', {title:'电磁感应 · 磁通量变化产生感应电流', chapter:'ch13', desc:'拖动磁铁插入或拔出线圈，观察磁通量变化时电流表指针的偏转。磁通量不变时（磁铁静止）无感应电流。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {magX: 260, t:0, mode:'manual'};
  addSlider(ctrl, {label:'磁铁位置', min:120, max:520, step:4, val:260, on:v=>st.magX=v});
  addBtn(ctrl, '自动演示', ()=>{ st.mode='auto'; st.t=0; });
  addBtn(ctrl, '手动模式', ()=>{ st.mode='manual'; });
  const W = canvas.width, H = canvas.height;
  const coilX=W*0.62, coilY=H/2;
  const fluxOf = x => Math.exp(-Math.abs(x-coilX)/95); // 磁通量随距离近似
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      st.t += 0.01;
      if(st.mode==='auto') st.magX = coilX-170+Math.abs(Math.sin(st.t*1.2))*340;
      const x = st.magX;
      const flux = fluxOf(x);
      const dFlux = Math.sin(st.t*1.2+Math.PI/2)*0.4; // 模拟变化率（自动）
      const changing = st.mode==='auto' || Math.abs(x-coilX)<80 && Math.abs(x-st.prevX||x)>0;
      // 磁铁
      const magW=60, magH=56;
      ctx.fillStyle='#DC2626';
      ctx.beginPath(); ctx.roundRect(x-magW, coilY-magH/2, magW/2, magH, 6); ctx.fill();
      ctx.fillStyle='#3B82F6';
      ctx.beginPath(); ctx.roundRect(x-magW/2, coilY-magH/2, magW/2, magH, 6); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText('N', x-magW*0.75, coilY+6); ctx.fillText('S', x-magW*0.25, coilY+6);
      ctx.fillStyle='#C7D6EE'; ctx.font='12px sans-serif';
      ctx.fillText('磁铁', x, coilY-magH/2-12);
      // 磁感线（磁铁右侧到线圈）
      ctx.strokeStyle='rgba(147,197,253,.55)'; ctx.lineWidth=1.6;
      for(let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(x+magW/2+4, coilY+i*14);
        ctx.quadraticCurveTo(coilX-30, coilY+i*20, coilX-14, coilY+i*12);
        ctx.stroke();
      }
      // 线圈
      ctx.strokeStyle='#F59E0B'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.ellipse(coilX, coilY, 34, 58, 0, 0, 7); ctx.stroke();
      // 电流表（右侧）
      const gx=W-120, gy=coilY, gr=44;
      ctx.fillStyle='#F8FAFC'; ctx.beginPath(); ctx.arc(gx,gy,gr,0,7); ctx.fill();
      ctx.strokeStyle='#1E293B'; ctx.lineWidth=2.5; ctx.stroke();
      const defl = changing? (st.mode==='auto'? dFlux*2 : Math.max(-1,Math.min(1,(st.magX-st.prevX||0))*0.03)) : 0;
      const a = Math.PI*0.75 + (Math.PI*1.5)*(0.5+defl*0.16);
      ctx.strokeStyle='#DC2626'; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+Math.cos(a)*30, gy+Math.sin(a)*30); ctx.stroke();
      ctx.fillStyle='#1E293B'; ctx.font='bold 11px sans-serif';
      ctx.fillText('A', gx-12, gy-10); ctx.fillText('0', gx+14, gy+12);
      ctx.fillStyle='#93A7C8'; ctx.font='12px sans-serif';
      ctx.fillText('电流表', gx, gy+gr+20);
      // 导线连接
      ctx.strokeStyle='#64748B'; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(coilX-18, coilY+50); ctx.lineTo(gx-28, gy+44); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(coilX-18, coilY-50); ctx.lineTo(gx-28, gy-44); ctx.stroke();
      // 磁通量条
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`磁通量 Φ = ${(flux*100).toFixed(0)}%`, (x+coilX)/2, coilY+92);
      ctx.fillStyle='rgba(125,211,252,.25)';
      ctx.beginPath(); ctx.roundRect(coilX-40, coilY+98, 80*flux, 10, 5); ctx.fill();
      const induced = changing;
      ctx.fillStyle=induced?'#34D399':'#64748B'; ctx.font='bold 13.5px sans-serif';
      ctx.fillText(induced? '磁通量变化 → 产生感应电流':'磁通量不变 → 无感应电流', W/2, 42);
      st.prevX = st.magX;
      setStat(this, `<span>状态 <b>${induced?'有感应电流':'无感应电流'}</b></span><span>条件 <b>Φ 发生变化</b></span><span>磁通量 <b>${(flux*100).toFixed(0)}%</b></span><span>应用 <b>发电机</b></span>`);
    }
  };
});

/* ---------- 演示 22：电磁波 ---------- */
regDemo('demo-emwave', {title:'电磁波 · 变化的电场与磁场交替传播', chapter:'ch13', desc:'电磁波中电场 E 与磁场 B 互相垂直、同步变化，沿传播方向交替激发向前传播。调节频率观察波长变化（c=λf）。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {f:1, t:0};
  addSlider(ctrl, {label:'频率 f（相对值）', min:0.4, max:2.4, step:0.1, val:1, on:v=>st.f=v});
  const W = canvas.width, H = canvas.height;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      st.t += 0.018;
      const cyE=H*0.30, cyB=H*0.70;
      const k = st.f*0.02;
      const ph = st.t*2.2;
      // 传播方向
      ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif'; ctx.textAlign='center';
      ctx.fillText('传播方向', W-70, 26);
      ctx.strokeStyle='#93A7C8'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(W-220,22); ctx.lineTo(W-140,22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W-152,15); ctx.lineTo(W-140,22); ctx.lineTo(W-152,29); ctx.stroke();
      // E 波（y方向，红色）
      ctx.strokeStyle='#F87171'; ctx.lineWidth=3;
      ctx.beginPath();
      for(let x=0;x<W;x++){ const y=cyE+Math.sin(x*k-ph)*70; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
      ctx.fillStyle='#F87171'; ctx.font='bold 15px sans-serif';
      ctx.fillText('E（电场，竖直方向）', 70, cyE-92);
      // B 波（z方向，蓝色）
      ctx.strokeStyle='#38BDF8'; ctx.lineWidth=3;
      ctx.beginPath();
      for(let x=0;x<W;x++){ const y=cyB+Math.sin(x*k-ph)*70; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.stroke();
      ctx.fillStyle='#38BDF8'; ctx.font='bold 15px sans-serif';
      ctx.fillText('B（磁场，垂直纸面）', 70, cyB+92);
      // 波长标注
      const lambda = 2*Math.PI/k;
      ctx.strokeStyle='#FDE68A'; ctx.lineWidth=1.6; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(80, cyE-120); ctx.lineTo(80+lambda, cyE-120); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#FDE68A'; ctx.font='13px sans-serif';
      ctx.fillText(`λ = c/f`, 80+lambda/2-30, cyE-130);
      // 同步点（E、B 同相位，垂直）
      const xp = (ph/k)%W;
      ctx.strokeStyle='rgba(253,230,138,.7)'; ctx.lineWidth=1.6; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(xp,cyE-80); ctx.lineTo(xp,cyB+80); ctx.stroke(); ctx.setLineDash([]);
      setStat(this, `<span>频率 f <b>${st.f.toFixed(1)}</b></span><span>波长 λ <b>${(lambda/40).toFixed(1)} 单位</b></span><span>c = λf <b>恒定 3×10⁸ m/s</b></span><span>E ⊥ B <b>同相变化</b></span><span>真空传播 <b>不需介质</b></span>`);
    }
  };
});

/* ---------- 演示 23：能级跃迁 ---------- */
regDemo('demo-quantum', {title:'能量量子化 · 能级与跃迁', chapter:'ch13', desc:'原子能量是量子化的（能级分立）。电子在不同能级间跃迁时吸收或放出光子，光子能量等于能级差：hν = E高 − E低。'},
function({el, canvas, ctrl}){
  const ctx = canvas.getContext('2d');
  const st = {t:0, from:3, to:1, auto:true};
  addBtn(ctrl, '自动跃迁', ()=>{ st.auto=true; st.t=0; });
  addBtn(ctrl, '手动：3→2', ()=>{ st.auto=false; st.jump(3,2); });
  addBtn(ctrl, '手动：2→1', ()=>{ st.auto=false; st.jump(2,1); });
  const W = canvas.width, H = canvas.height;
  const levels=[{n:1,E:0,y:300},{n:2,E:5,y:230},{n:3,E:8,y:170},{n:4,E:10,y:120}];
  let cur=3, photon=null, photons=[];
  st.jump=(a,b)=>{ cur=a; photon={a,b,pr:0}; photons.push(photon); };
  st.t=0;
  return {
    draw(){
      ctx.clearRect(0,0,W,H);
      st.t += 0.02;
      if(st.auto){
        const seq=[[3,1],[1,2],[2,3],[3,2],[2,1],[1,3]];
        const idx = Math.floor(st.t*0.5)%seq.length;
        const [a,b]=seq[idx];
        if(!st._curSeq || st._curSeq[0]!==idx){ st._curSeq=[idx]; cur=a; photon={a,b,pr:0}; }
      }
      // 能级横线
      levels.forEach(L=>{
        ctx.strokeStyle = cur===L.n? '#FDE68A':'#7C8DB0'; ctx.lineWidth = cur===L.n?5:3;
        ctx.beginPath(); ctx.moveTo(120,L.y); ctx.lineTo(W-160,L.y); ctx.stroke();
        ctx.fillStyle='#C7D6EE'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
        ctx.fillText(`n=${L.n}`, 92, L.y+5);
        ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif';
        ctx.fillText(`E=${L.E}（相对）`, W-150, L.y+5);
      });
      ctx.fillStyle='#93A7C8'; ctx.font='12px sans-serif';
      ctx.fillText('能量', 44, 84);
      // 电子
      const L=levels.find(l=>l.n===cur);
      const grad=ctx.createRadialGradient(W-260-4,L.y-4,3,W-260,L.y,13);
      grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#7DD3FC');
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(W-260,L.y,13,0,7); ctx.fill();
      // 光子（跃迁动画）
      if(photon){
        const a=levels.find(l=>l.n===photon.a), b=levels.find(l=>l.n===photon.b);
        photon.pr += 0.03;
        if(photon.pr>=1){ cur=photon.b; photon=null; }
        else{
          const yy = a.y+(b.y-a.y)*photon.pr;
          const xx = W-260 + Math.sin(photon.pr*Math.PI)*160;
          const color = b.y<a.y? '#FDE68A':'#38BDF8';
          ctx.fillStyle=color;
          ctx.beginPath(); ctx.arc(xx,yy,7,0,7); ctx.fill();
          ctx.fillStyle='#C7D6EE'; ctx.font='12px sans-serif';
          ctx.fillText(b.y<a.y? `放出光子 hν = E${photon.a}−E${photon.b}`:`吸收光子 hν = E${photon.b}−E${photon.a}`, W/2, 60);
        }
      }else{
        ctx.fillStyle='#93A7C8'; ctx.font='12.5px sans-serif';
        ctx.fillText('高能级 → 低能级：放出光子（发光）', W/2, 60);
      }
      setStat(this, `<span>能级 <b>分立不连续</b></span><span>能量子 ε = hν</span><span>跃迁放出 <b>hν = 能级差</b></span><span>光谱 <b>分立亮线</b></span>`);
    }
  };
});
