function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.from((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<i class="m">$1</i>');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

}

/* ---------- hero 动画（电场线） ---------- */
function heroCanvas(){
  const cv=$('#hero-canvas'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const charges=[{x:W*0.82,y:H*0.62,q:1},{x:W*0.66,y:H*0.36,q:-1}];
  const field=(x,y)=>{
    let Ex=0,Ey=0;
    charges.forEach(c=>{const dx=x-c.x,dy=y-c.y,r=Math.sqrt(dx*dx+dy*dy+8); Ex+=c.q*dx/(r*r*r); Ey+=c.q*dy/(r*r*r);});
    return {x:Ex,y:Ey};
  };
  const particles=[];
  for(let i=0;i<46;i++){ particles.push({x:Math.random()*W,y:Math.random()*H}); }
  let t=0;
  const draw=()=>{
    t+=0.016;
    ctx.clearRect(0,0,W,H);
    // 电场线（静态底层，淡）
    ctx.strokeStyle='rgba(125,211,252,.14)'; ctx.lineWidth=1.2;
    for(let i=0;i<26;i++){
      const a=i/26*Math.PI*2;
      let x=charges[0].x+Math.cos(a)*6, y=charges[0].y+Math.sin(a)*6;
      ctx.beginPath(); ctx.moveTo(x,y);
      for(let s=0;s<40;s++){
        const f=field(x,y),m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
        x+=f.x/m*10; y+=f.y/m*10;
        if(x<0||x>W||y<0||y>H)break;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // 电荷
    charges.forEach(c=>{
      const g=ctx.createRadialGradient(c.x-3,c.y-3,2,c.x,c.y,26);
      g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1, c.q>0?'rgba(248,113,113,.75)':'rgba(56,189,248,.75)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,26,0,7); ctx.fill();
      ctx.fillStyle='#0F1E4D'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
      ctx.fillText(c.q>0?'+':'−', c.x, c.y+7);
    });
    // 粒子沿场漂移
    particles.forEach(p=>{
      const f=field(p.x,p.y),m=Math.sqrt(f.x*f.x+f.y*f.y)||1;
      p.x+=f.x/m*1.4; p.y+=f.y/m*1.4;
      if(p.x<0||p.x>W||p.y<0||p.y>H){ p.x=Math.random()*W; p.y=Math.random()*H; }
      ctx.fillStyle='rgba(221,234,254,.5)';
      ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,7); ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) draw();
  else { draw(); cancelAnimationFrame(draw); }
}

/* ---------- 知识图谱（SVG 有向图） ---------- */
const graphState = {concepts:false, edges:'all', path:false};
function graphLayout(){
  const nodes = KG.nodes;
  const W=1200;
  const pos={};
  const root=nodes.find(n=>n.type==='root');
  pos.root={x:W/2,y:46};
  const chs=CH_ORDER;
  const colW=W/(chs.length+1);
  chs.forEach((cid,i)=>{
    pos[cid] = {x:colW*(i+1), y:150};
  });
  // 章节→小节
  const secsByCh={};
  nodes.filter(n=>n.type==='section').forEach(s=>{ (secsByCh[s.chapter]=secsByCh[s.chapter]||[]).push(s); });
  Object.keys(secsByCh).forEach(cid=>{
    const list=secsByCh[cid];
    const ci=CH_ORDER.indexOf(cid);
    const cx=colW*(ci+1);
    list.forEach((s,si)=>{
      const offset=(si-(list.length-1)/2)*64;
      pos[s.id]={x:cx+offset, y:300+si*118};
    });
  });
  // 概念
  const concepts=nodes.filter(n=>n.type==='concept');
  const conBySec={};
  concepts.forEach(c=>{ (conBySec[c.section]=conBySec[c.section]||[]).push(c); });
  Object.keys(conBySec).forEach(sid=>{
    const list=conBySec[sid], base=pos[sid];
    if(!base) return;
    const rowW=Math.min(list.length*150, 460);
    list.forEach((c,ci)=>{
      const per=list.length>4?120:150;
      pos[c.id]={x:base.x-(list.length-1)*per/2+ci*per, y:base.y+84};
    });
  });
  return {pos, W, H: 640};
}
function renderGraph(){
  const svg=$('#graph-svg'); if(!svg) return;
  const {pos,W}=graphLayout();
  const nodes=KG.nodes.filter(n=> graphState.concepts || n.type!=='concept');
  const showPrereq = graphState.edges==='all';
  const showPath = graphState.path;
  // 拓扑顺序（教材顺序）
  const order=['s9-1','s9-2','s9-3','s9-4','s10-1','s10-2','s10-3','s10-4','s10-5','s11-1','s11-2','s11-3','s11-4','s11-5','s12-1','s12-2','s12-3','s12-4','s13-1','s13-2','s13-3','s13-4','s13-5'];
  const orderIdx={}; order.forEach((s,i)=>orderIdx[s]=i);
  let maxY=150;
  Object.values(pos).forEach(p=>maxY=Math.max(maxY,p.y));
  const H=Math.max(640, maxY+160);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // 图例
  $('#g-legend').innerHTML = CH_ORDER.map(c=>`<span class="lg"><i style="background:${CH[c].color}"></i>${CH[c].num.replace('第','').replace('章','')}</span>`).join('')+
    `<span class="lg"><i style="background:#475569"></i>前置依赖（虚线）</span>`;
  // 学习路径框
  const pb=$('#g-pathbox');
  if(showPath){ pb.innerHTML = `<b>推荐学习路径：</b>`+order.map((s,i)=>`<span>${i+1}.${SECTIONS[s].title}</span>`).join(' → '); }
  else pb.innerHTML='';
  // 边：章节树
  let edgesHtml='';
  // root→chapter
  CH_ORDER.forEach((cid,i)=>{
    const p=pos[cid];
    edgesHtml += `<path class="g-edge" d="M${pos.root.x},${pos.root.y+16} C${pos.root.x},${110} ${p.x},${110} ${p.x},${p.y-24}"/>`;
  });
  // chapter→section
  nodes.filter(n=>n.type==='section').forEach(s=>{
    const p=pos[s.id], c=pos[s.chapter];
    edgesHtml += `<path class="g-edge" d="M${c.x},${c.y+26} C${c.x},${c.y+70} ${p.x},${p.y-60} ${p.x},${p.y-24}"/>`;
  });
  // section→concept
  if(graphState.concepts){
    nodes.filter(n=>n.type==='concept').forEach(c=>{
      const p=pos[c.id], s=pos[c.section];
      if(!p||!s) return;
      edgesHtml += `<path class="g-edge" d="M${s.x},${s.y+14} L${p.x},${p.y-14}" stroke="#C9D6EC"/>`;
    });
  }
  // 前置依赖边（有向曲线）
  if(showPrereq){
    KG.prereq.forEach(([a,b],i)=>{
      const pa=pos[a], pb2=pos[b];
      if(!pa||!pb2) return;
      const dx=pb2.x-pa.x, dy=pb2.y-pa.y;
      const mx=(pa.x+pb2.x)/2, my=(pa.y+pb2.y)/2;
      const c1x=pa.x+dx*0.35, c1y=pa.y+dy*0.35+ (dx===0? -70: -36);
      const c2x=pb2.x-dx*0.35, c2y=pb2.y-dy*0.35+ (dx===0? -70: -36);
      edgesHtml += `<path class="g-edge prereq" d="M${pa.x},${pa.y+16} C${c1x},${c1y} ${c2x},${c2y} ${pb2.x},${pb2.y-20}"/>
      <polygon class="g-edge" points="${pb2.x-7},${pb2.y-26} ${pb2.x+7},${pb2.y-26} ${pb2.x},${pb2.y-12}" fill="#94A3B8"/>`;
    });
  }
  // 节点
  let nodesHtml='';
  const nodeMeta = n=>{
    if(n.type==='root') return {w:130,h:44,r:22, fill:'#0F1E4D', stroke:'#0F1E4D', text:'#fff', fs:16};
    if(n.type==='chapter'){ const c=CH[n.chapter]; return {w:150,h:52,r:26, fill:'#fff', stroke:c.color, text:'#17233D', fs:15, sw:2.6}; }
    if(n.type==='section'){ const c=CH[n.chapter]; return {w:150,h:56,r:28, fill:'#fff', stroke:c.color, text:'#17233D', fs:13.5, sw:2}; }
    const c=CH[n.chapter]; return {w:132,h:40,r:20, fill:'#F5F7FB', stroke:'#C9D6EC', text:'#3D4C66', fs:11.5, sw:1.4};
  };
  nodes.forEach(n=>{
    const p=pos[n.id]; if(!p) return;
    const m=nodeMeta(n);
    const x=p.x-m.w/2, y=p.y-m.h/2;
    const isPath = showPath && n.type==='section' && orderIdx[n.id]!==undefined;
    const badge = isPath? `<circle cx="${p.x+m.w/2-14}" cy="${p.y-m.h/2+14}" r="10" fill="#F59E0B"/><text x="${p.x+m.w/2-14}" y="${p.y-m.h/2+17.5}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">${orderIdx[n.id]+1}</text>`:'';
    const sub = n.sub? `<text class="nsub" x="${p.x}" y="${p.y+m.h/2-7}">${esc(n.sub)}</text>`:'';
    nodesHtml += `<g class="g-node ${n.type}" data-id="${n.id}" data-jump="${n.type==='root'?'#/home':n.type==='chapter'?'#/learn/'+n.chapter:'#/learn/'+(n.type==='section'?n.id:n.section)}" data-type="${n.type}" style="cursor:pointer">
      <rect class="chip" x="${x}" y="${y}" width="${m.w}" height="${m.h}" rx="${m.r}" fill="${m.fill}" stroke="${m.stroke}" stroke-width="${m.sw||1.6}"/>
      ${badge}
      <text class="nname" x="${p.x}" y="${p.y+(sub? 2:6)}" font-size="${m.fs}" font-weight="700" fill="${m.text}">${esc(n.name)}</text>
      ${sub}
    </g>`;
  });
  svg.innerHTML = `<defs><linearGradient id="ggrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0891B2"/></linearGradient></defs>`+edgesHtml+nodesHtml;
  // 交互
  $$('.g-node', svg).forEach(g=>{
    g.addEventListener('click', e=>{ e.stopPropagation(); location.hash = g.dataset.jump; });
  });
  // 平移缩放
  const box=$('#graph-box');
  let tx=0, ty=0, scale=1;
  const apply=()=>{ svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; svg.style.transformOrigin='0 0'; };
  let drag=null;
  svg.addEventListener('mousedown', e=>{ drag={x:e.clientX-tx,y:e.clientY-ty}; });
  window.addEventListener('mousemove', e=>{ if(drag){ tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); } });
  window.addEventListener('mouseup', ()=>drag=null);
  box.addEventListener('wheel', e=>{
    e.preventDefault();
    const d = e.deltaY<0?1.1:0.9;
    scale=Math.max(0.45, Math.min(2.4, scale*d));
    apply();
  }, {passive:false});
}

function renderBlocks(blocks){
  let html='', idx=0, listOpen=false;
  const flushList=()=>{ if(listOpen){ html+='</div>'; listOpen=false; } };
  blocks.forEach(b=>{
    if(b.startsWith('## ')){
      flushList(); idx++;
      html += `<h3 class="mod-title"><span class="idx">${idx}</span>${esc(b.slice(3))}</h3>`;
    }else if(b.startsWith('> ')){
      flushList(); html += `<div class="note">${md(b.slice(2))}</div>`;
    }else if(b.startsWith('$$')){
      flushList();
      const mm = b.match(/^\$\$\s*(.*?)：/);
      const body = mm? b.slice(b.indexOf('：')+1) : b.slice(2);
      html += `<div class="formula">${mm?`<span class="tag">${esc(mm[1])}</span>`:''}${md(body)}</div>`;
    }else if(b.startsWith('例 ')){
      flushList(); html += `<div class="ex-title">例题 ${esc(b.slice(2))}</div>`;
    }else if(b.startsWith('答 ')){
      flushList(); html += `<div class="ex-solve">${md(b.slice(2))}</div>`;
    }else if(b.startsWith('!demo:')){
      flushList(); html += `<div class="demo-slot" data-demo="${b.slice(6)}"></div>`;
    }else if(b.startsWith('!quiz:')){
      flushList(); html += `<button class="qlink btn btn-soft" data-quiz="${b.slice(6)}" style="margin:8px 0">${ICO.quiz}打开本章课后题库</button>`;

      if(!listOpen){ html+='<div class="klist">'; listOpen=true; }
      html += `<p class="li">${md(b.slice(2))}</p>`;
    }else{
      flushList(); html += `<p>${md(b)}</p>`;
    }
  });
  flushList();
  return html;
}

        <span class="lbl">题型</span>
        ${['计算','概念','选择'].map(t=>`<button class="q-chip ${quizState.types.includes(t)?'on':''}" data-type="${t}">${t}题</button>`).join('')}
        <input type="search" id="q-kw" placeholder="搜索关键词…" value="${esc(quizState.kw)}" style="margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:13px;width:170px">
        <button class="q-chip q-shuffle ${quizState.shuffle?'on':''}" id="q-shuf">随机顺序</button>
      </div>
    </div>
    <div id="q-list">${shown.length? shown.map((q,i)=>quizItemHTML(q,i)).join('') : `<div class="q-empty">没有符合条件的题目，试试放宽筛选条件</div>`}</div>`;
  // 章节筛选（多选）
  $$('[data-ch]', host).forEach(b=>b.addEventListener('click', ()=>{
    const c=b.dataset.ch;
    const i=quizState.chs.indexOf(c);
    if(i>=0) quizState.chs.splice(i,1); else quizState.chs.push(c);
    renderQuiz();
  }));
  $$('[data-type]', host).forEach(b=>b.addEventListener('click', ()=>{
    const t=b.dataset.type;
    const i=quizState.types.indexOf(t);
    if(i>=0) quizState.types.splice(i,1); else quizState.types.push(t);
    renderQuiz();
  }));
  const kw=$('#q-kw', host); if(kw) kw.addEventListener('input', ()=>{ quizState.kw=kw.value.trim(); renderQuiz(); });
  const sh=$('#q-shuf', host); if(sh) sh.addEventListener('click', ()=>{ quizState.shuffle=!quizState.shuffle; renderQuiz(); });
  $$('.q-ans-btn', host).forEach(b=>b.addEventListener('click', ()=>{
    const box=document.getElementById(b.dataset.for);
    const show=box.classList.toggle('show');
    b.innerHTML = show? '收起答案':'查看答案与解析';
  }));
  $$('[data-addwrong]', host).forEach(b=>b.addEventListener('click', ()=>{
    addWrongGlobal(b.dataset.addwrong);
  }));
}
function quizItemHTML(q, i){
  const c=CH[q.ch];
  const opts = q.opts? `<div class="q-opts">${q.opts.map(o=>`<div>${o}. ${esc((q['opt'+o]) || (q.optsText&&q.optsText[o]) || '')}</div>`).join('')}</div>`:'';
  return `<div class="q-item">
    <div class="q-meta">
      <span class="q-tag" style="background:${c.color}">${c.num}</span>
      <span class="q-tag" style="background:${c.color}aa">${SECTIONS[q.sec].slug} ${secTitle(q.sec)}</span>
      <span class="q-type">${q.type}题</span>
      <span class="q-qnum">第 ${i+1} 题</span>
      <span style="margin-left:auto"><button class="q-chip" data-addwrong="${q.id}" style="padding:3px 10px;font-size:11.5px">标记为错题</button></span>
    </div>
    <div class="q-stem">${md(q.stem)}</div>
    ${opts}
    <button class="q-ans-btn" data-for="qans-${q.id}">查看答案与解析</button>
    <div class="q-ans" id="qans-${q.id}">
      <div><span class="ans-lbl">答案：</span>${md(q.ans)}</div>
      <div style="margin-top:6px"><span class="ans-lbl" style="color:var(--warn)">解析：</span>${md(q.ana||'')}</div>
    </div>
  </div>`;
}

/* ================= 学生学情 ================= */
const STORE_KEY='phy_b3_students_v1';
function loadStudents(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ return []; } }
function saveStudents(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function defaultStudents(){
  return [
    {name:'示例：李明', wrongs:['q903','q1103','q1204','q1305'], manual:{}},
    {name:'示例：王芳', wrongs:['q905','q1008','q1306'], manual:{}}
  ];
}
let stuState = {list: loadStudents(), sel: null, filterCh: null};
function masteryFor(stu, ch){
  const qs=QUIZ.filter(q=>q.ch===ch);
  if(!qs.length) return 0;
  let wrong=0;
  qs.forEach(q=>{ if(stu.wrongs.includes(q.id)) wrong++; });
  let score = Math.max(0, 100 - wrong/qs.length*100);
  const m=stu.manual&&stu.manual[ch];
  if(m!==undefined) score = Math.round((score+m)/2);
  return Math.round(score);
}
function renderStudents(){
  const host = $('#view-students');
  const list = stuState.list;
  const sel = list.find(s=>s.name===stuState.sel) || list[0] || null;
  if(!list.length){
    host.innerHTML = `
    <div class="section-title"><span class="bar" style="background:var(--c12)"></span><h2>学生学情 · 错题与掌握度</h2></div>
    <div class="stu-grid">
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5l8 4-8 4-8-4 8-4z"/><path d="M4 13l8 4 8-4"/></svg>导入学生名单</h3>
        <div class="drop-zone" id="stu-drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg><div>点击选择名单文件（.csv / .txt），或粘贴名单</div></div>
        <textarea id="stu-paste" rows="4" placeholder="每行一个姓名，例如：&#10;张三&#10;李四&#10;王五&#10;&#10;也支持“姓名,学号”格式" style="width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit"></textarea>
        <div class="stu-actions">
          <button class="btn btn-solid" id="stu-parse">导入名单</button>
          <button class="btn btn-soft" id="stu-sample">载入示例数据</button>
        </div>
        <div class="tpl">格式说明：<br><code>张三</code> 或 <code>张三,2025001</code><br>一行一名学生，也可含学号</div>
      </div>
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.8-3.4 3.4-5.2 6.5-5.2s5.7 1.8 6.5 5.2"/></svg>名单为空</h3>
        <div class="empty-tip">导入学生名单后，可在此记录每位同学的错题，并自动统计各章知识点掌握程度。</div>
      </div>
    </div>`;
    bindStudentActions(host);
    return;
  }
  host.innerHTML = `
    <div class="section-title"><span class="bar" style="background:var(--c12)"></span><h2>学生学情 · 错题与掌握度</h2><span class="more">数据仅保存在本机浏览器</span></div>
    <div class="stu-grid">
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>学生名单（${list.length}人）</h3>
        <div class="stu-actions" style="margin-bottom:12px">
          <button class="btn btn-soft" id="stu-addmore">添加/导入更多</button>
          <button class="btn btn-soft" id="stu-clear">清空名单</button>
        </div>
        <div id="stu-list">${list.map(s=>`
          <div class="stu-card ${s.name===sel.name?'on':''}" data-stu="${esc(s.name)}">
            <div class="stu-avatar" style="background:${chColor(list.indexOf(s)%5===0?'ch9':list.indexOf(s)%5===1?'ch10':list.indexOf(s)%5===2?'ch11':list.indexOf(s)%5===3?'ch12':'ch13')}">${esc(s.name.charAt(0))}</div>
            <div><div class="nm">${esc(s.name)}</div><div class="sub">错题 ${s.wrongs.length} 题 · 平均掌握度 ${Math.round(CH_ORDER.reduce((a,c)=>a+masteryFor(s,c),0)/5)}%</div></div>
          </div>`).join('')}</div>
      </div>
      <div class="panel">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>${esc(sel.name)} 的学情报告</h3>
        <div class="master-grid">
          ${CH_ORDER.map(c=>{
            const m=masteryFor(sel,c), color=m>=80?'#16A34A':m>=60?'#D97706':'#DC2626';
            return `<div class="m-cell">
              <div class="m-ch" style="color:${CH[c].color}">${CH[c].num.replace('第','').replace('章','')} ${CH[c].name.slice(0,6)}</div>
              <div class="m-val" style="color:${color}">${m}%</div>
              <div class="m-bar"><i style="width:${m}%;background:${color}"></i></div>
              <div class="m-note">${m>=80?'掌握良好':m>=60?'有待加强':'重点复习'}</div>
            </div>`;
          }).join('')}
        </div>
        <h3 style="margin-top:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.6"/></svg>错题记录（${sel.wrongs.length} 题）</h3>
        <div class="wrong-list">
          ${sel.wrongs.length? sel.wrongs.map(qid=>{
            const q=QUIZ.find(x=>x.id===qid); if(!q) return '';
            const c=CH[q.ch];
            return `<div class="wrong-item"><span class="q-tag" style="background:${c.color}">${c.num}</span><span style="flex:1">${md(q.stem.slice(0,46))}${q.stem.length>46?'…':''}</span><button class="w-del" data-del="${qid}">✕</button></div>`;
          }).join('') : '<div class="empty-tip">暂无错题记录。可在题库中点击"标记为错题"，或手动添加。</div>'}
        </div>
        <div class="stu-actions">
          <button class="btn btn-soft" id="stu-addwrong">从题库选择错题</button>
          <button class="btn btn-soft" id="stu-resetwrong">清空该生错题</button>
        </div>
      </div>
    </div>`;
  bindStudentActions(host);
  // 事件
  $$('[data-stu]', host).forEach(el=>el.addEventListener('click', ()=>{ stuState.sel=el.dataset.stu; renderStudents(); }));
  $$('[data-del]', host).forEach(el=>el.addEventListener('click', ()=>{
    const qid=el.dataset.del, s=stuState.list.find(x=>x.name===sel.name);
    s.wrongs=s.wrongs.filter(w=>w!==qid); saveStudents(stuState.list); renderStudents(); toast('已移除错题记录');
  }));
}
function bindStudentActions(host){
  const drop=$('#stu-drop', host);
  if(drop){
    drop.addEventListener('click', ()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,.txt'; inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>parseNames(String(r.result)); r.readAsText(f); }; inp.click(); });
    drop.addEventListener('dragover', e=>{e.preventDefault(); drop.classList.add('drag');});
    drop.addEventListener('dragleave', ()=>drop.classList.remove('drag'));
    drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f){ const r=new FileReader(); r.onload=()=>parseNames(String(r.result)); r.readAsText(f); } });
  }
  const parse=$('#stu-parse', host);
  if(parse) parse.addEventListener('click', ()=>{ const v=$('#stu-paste',host).value.trim(); if(v) parseNames(v); });
  const sample=$('#stu-sample', host);
  if(sample) sample.addEventListener('click', ()=>{ stuState.list=defaultStudents(); saveStudents(stuState.list); renderStudents(); toast('已载入示例数据'); });
  const more=$('#stu-addmore', host);
  if(more) more.addEventListener('click', ()=>{ const name=prompt('输入学生姓名（每行一个，可含学号）：',''); if(name&&name.trim()) parseNames(name); });
  const clear=$('#stu-clear', host);
  if(clear) clear.addEventListener('click', ()=>{ if(confirm('确认清空全部学生数据？此操作不可撤销。')){ stuState.list=[]; stuState.sel=null; saveStudents(stuState.list); renderStudents(); } });
  const addw=$('#stu-addwrong', host);
  if(addw) addWrongPicker(host);
  const resetw=$('#stu-resetwrong', host);
  if(resetw) resetw.addEventListener('click', ()=>{ const s=stuState.list.find(x=>x.name===stuState.sel); if(s){ s.wrongs=[]; saveStudents(stuState.list); renderStudents(); toast('已清空该生错题'); } });
}
function parseNames(text){
  const names=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[,，\t]/)[0].trim()).filter(Boolean);
  const existing=new Set(stuState.list.map(s=>s.name));
  const added=[];
  names.forEach(n=>{ if(!existing.has(n)){ stuState.list.push({name:n, wrongs:[], manual:{}}); existing.add(n); added.push(n); } });
  saveStudents(stuState.list);
  if(!stuState.sel && stuState.list.length) stuState.sel=stuState.list[0].name;
  renderStudents();
  toast(`已导入 ${added.length} 名学生${names.length-added.length?`，${names.length-added.length} 名已存在`:''}`);
}
function addWrongPicker(host){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px';
  const panel=document.createElement('div');
  panel.style.cssText='background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:76vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)';
  const head=document.createElement('div');
  head.style.cssText='padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px';
  head.textContent='选择要标记为错题的题目（可多选）';
  const body=document.createElement('div');
  body.style.cssText='overflow:auto;padding:14px 18px;flex:1';
  body.innerHTML=QUIZ.map(q=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed #EEF2F9;font-size:13px;cursor:pointer"><input type="checkbox" value="${q.id}" style="margin-top:4px"><span><b style="color:${CH[q.ch].color}">${CH[q.ch].num} ${SECTIONS[q.sec].title}</b> · ${esc(q.stem.slice(0,60))}${q.stem.length>60?'…':''}</span></label>`).join('');
  const foot=document.createElement('div');
  foot.style.cssText='padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end';
  const ok=document.createElement('button'); ok.className='btn btn-solid'; ok.textContent='确定添加';
  const cancel=document.createElement('button'); cancel.className='btn btn-soft'; cancel.textContent='取消';
  foot.appendChild(cancel); foot.appendChild(ok);
  panel.appendChild(head); panel.appendChild(body); panel.appendChild(foot); overlay.appendChild(panel);
  document.body.appendChild(overlay);
  const s=stuState.list.find(x=>x.name===stuState.sel);
  cancel.onclick=()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  ok.onclick=()=>{
    const picked=$$('input:checked', body).map(i=>i.value);
    picked.forEach(qid=>{ if(s && !s.wrongs.includes(qid)) s.wrongs.push(qid); });
    saveStudents(stuState.list); overlay.remove(); renderStudents(); toast(`已添加 ${picked.length} 道错题`);
  };
}
function addWrongGlobal(qid){
  const s=stuState.list.find(x=>x.name===stuState.sel);
  if(!s){ toast('请先在"学生学情"导入名单并选中学生'); location.hash='#/students'; return; }
  if(!s.wrongs.includes(qid)){ s.wrongs.push(qid); saveStudents(stuState.list); }
  toast(`已为 ${s.name} 标记错题（可到学生学情查看）`);
}

/* ================= 初始化 ================= */
function init(){
  document.addEventListener('click', e=>{
    const a=e.target.closest('a[href^="#"]');
    if(a && !e.defaultPrevented){
      e.preventDefault();
      if(location.hash===a.getAttribute('href')) router();
      else location.hash = a.getAttribute('href');
    }
  });
  router();
  bindGraphControls();
  document.body.addEventListener('click', e=>{
    const gbox=e.target.closest('#graph-box');
    // 图例等由 renderGraph 内部绑定
  });
}
init();
